<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Immunoblot assay workflow scene preview</title>
  <desc id="desc">Original editable-style preview of sample collection and lysis, clarified lysate, total-protein assessment, SDS-PAGE, membrane transfer, antibody probing, signal detection, and an illustrative target/loading-control result. Bands are placeholders, not data.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2A9D8F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4F7CAC"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7B78C9"/></marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#E76F51"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F6F8FB"/>
  <text x="40" y="44" fill="#26323D" font-family="Arial, sans-serif" font-size="25" font-weight="700">Immunoblot assay workflow</text>
  <text x="40" y="70" fill="#667085" font-family="Arial, sans-serif" font-size="14">Editable sample, target, control, treatment, and detection placeholders</text>
  <rect x="24" y="90" width="912" height="370" rx="22" fill="#FFFFFF" stroke="#D9E4EC" stroke-width="2"/>

  <g stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
    <g aria-label="Collected sample and lysate">
      <path d="M52 149h42l-6 56H59z" fill="#FFFFFF" stroke-width="2"/><path d="M58 188h31l-2 16H60z" fill="#FCE0D8" stroke="none"/><rect x="51" y="141" width="44" height="11" rx="4" fill="#667085" stroke-width="2"/>
      <path d="M123 149h42l-6 56h-29z" fill="#FFFFFF" stroke-width="2"/><path d="M129 173h31l-4 31h-23z" fill="#2A9D8F" stroke="none"/><path d="M122 144l31-8 12 8" fill="none" stroke="#2A9D8F" stroke-width="4"/>
    </g>
    <g aria-label="Clarification and clarified lysate">
      <rect x="242" y="143" width="84" height="68" rx="13" fill="#D9F4E5" stroke-width="2.5"/><path d="M258 143q26-24 52 0" fill="#FFFFFF" stroke-width="2.5"/><circle cx="284" cy="174" r="18" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/><circle cx="284" cy="174" r="6" fill="#2A9D8F" stroke="none"/>
      <path d="M351 149h42l-6 56h-29z" fill="#FFFFFF" stroke-width="2"/><path d="M357 181h31l-3 23h-25z" fill="#D9F4E5" stroke="none"/><path d="M350 144l31-8 12 8" fill="none" stroke="#2A9D8F" stroke-width="4"/>
    </g>
    <g aria-label="Total protein assessment">
      <rect x="490" y="146" width="92" height="62" rx="10" fill="#DCE7F5" stroke-width="2.5"/>
      <g fill="#E9B44C" stroke="none"><circle cx="510" cy="164" r="5"/><circle cx="530" cy="164" r="5"/><circle cx="550" cy="164" r="5"/><circle cx="570" cy="164" r="5"/><circle cx="510" cy="183" r="5"/><circle cx="530" cy="183" r="5"/><circle cx="550" cy="183" r="5"/><circle cx="570" cy="183" r="5"/></g>
    </g>
    <g aria-label="SDS-PAGE apparatus">
      <rect x="727" y="139" width="92" height="72" rx="11" fill="#DCE7F5" stroke-width="2.5"/><rect x="742" y="150" width="62" height="45" rx="4" fill="#FFFFFF" stroke="#4F7CAC" stroke-width="2"/><path d="M750 159v27m10-27v27m10-27v27m10-27v27m10-27v27" stroke="#4F7CAC" stroke-width="2"/>
    </g>
    <g aria-label="Membrane transfer apparatus">
      <rect x="727" y="321" width="92" height="72" rx="11" fill="#E4DFFF" stroke-width="2.5"/><rect x="745" y="334" width="56" height="42" rx="4" fill="#FFFFFF" stroke="#7B78C9" stroke-width="3"/><path d="M756 340v30m9-30v30m9-30v30m9-30v30" stroke="#7B78C9" stroke-width="2"/>
    </g>
    <rect x="619" y="342" width="45" height="30" rx="5" fill="#E4DFFF" stroke="#7B78C9" stroke-width="2.2" aria-label="Blocked membrane"/>
    <g aria-label="Primary and secondary antibodies" fill="none" stroke-width="5">
      <path d="M573 344v33m0-21-17-18m17 18 17-18" stroke="#E76F51"/><path d="M501 344v33m0-21-17-18m17 18 17-18" stroke="#7B78C9"/>
      <path d="M556 338l-6-6m40 6 6-6M484 338l-6-6m40 6 6-6" stroke="#E9B44C" stroke-width="4"/>
    </g>
    <g aria-label="Signal detector">
      <rect x="279" y="321" width="92" height="72" rx="11" fill="#DCE7F5" stroke-width="2.5"/><rect x="294" y="333" width="62" height="37" rx="5" fill="#FFFFFF" stroke-width="2"/><path d="M302 360c15-18 28 12 45-9" fill="none" stroke="#E9B44C" stroke-width="3"/>
    </g>
    <g aria-label="Illustrative blot placeholder">
      <rect x="113" y="313" width="108" height="82" rx="8" fill="#FFFFFF" stroke-width="2.5"/><path d="M126 322v64m27-64v64m27-64v64m27-64v64" stroke="#D9E4EC" stroke-width="1.5"/>
      <path d="M122 340h20m12 0h19m12 0h22M122 374h20m12 0h19m12 0h22" stroke="#7B78C9" stroke-width="7"/>
    </g>
  </g>

  <g fill="none" stroke-width="2.4">
    <path d="M103 176h11" stroke="#2A9D8F" marker-end="url(#arrow-teal)"/><path d="M175 176h64" stroke="#2A9D8F" marker-end="url(#arrow-teal)"/><path d="M328 176h15" stroke="#2A9D8F" marker-end="url(#arrow-teal)"/><path d="M404 176h84" stroke="#4F7CAC" marker-end="url(#arrow-blue)"/><path d="M584 176h140" stroke="#4F7CAC" marker-end="url(#arrow-blue)"/>
    <path d="M773 214v104" stroke="#7B78C9" marker-end="url(#arrow-purple)"/><path d="M724 357h-58" stroke="#7B78C9" marker-end="url(#arrow-purple)"/><path d="M617 357h-15" stroke="#E76F51" marker-end="url(#arrow-coral)"/><path d="M546 357h-16" stroke="#E76F51" marker-end="url(#arrow-coral)"/><path d="M474 357H374" stroke="#4F7CAC" marker-end="url(#arrow-blue)"/><path d="M276 357h-53" stroke="#4F7CAC" marker-end="url(#arrow-blue)"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#26323D" font-size="14" font-weight="700">
      <text x="110" y="239">1  Collect + lyse</text><text x="322" y="239">2  Clarify lysate</text><text x="536" y="239">3  Assess total protein</text><text x="773" y="239">4  Load + SDS-PAGE</text>
      <text x="773" y="427">5  Transfer to membrane</text><text x="566" y="427">6  Block + primary / secondary</text><text x="325" y="427">7  Detect signal</text><text x="132" y="427">8  Illustrative result</text>
    </g>
    <g fill="#667085" font-size="12">
      <text x="110" y="263">Sample / treatment</text><text x="322" y="263">Retain clarified lysate</text><text x="73" y="339" text-anchor="end" fill="#E76F51">Target</text><text x="103" y="376" text-anchor="end" fill="#7B78C9">Loading control</text>
    </g>
  </g>
  <text x="480" y="489" text-anchor="middle" fill="#8A5A18" font-family="Arial, sans-serif" font-size="12">Bands are placeholders, not data. Validate the loading control for this sample and treatment context.</text>
  <text x="480" y="514" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="11">One blot alone is not a complete quantitative analysis; no linearity, transfer, specificity, normalization, fold-change, significance, mechanism, or reproducibility claim.</text>
</svg>
