name: Figure source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-release.txt -r requirements-browser-qa.txt
      - run: python scripts/validate-scientific-assets.py --library --require-public-release
      - run: python scripts/validate-vendor-bundle.py
      - run: node --test tests/selectionFontScaleRead.test.cjs
      - run: node --test tests/singleObjectShiftClick.test.cjs tests/objectShiftMarquee.test.cjs tests/ordinaryCanvasDragCancel.test.cjs tests/historyActiveSelectionPose.test.cjs tests/directSelectionTextMarquee.test.cjs tests/groupObjectSelection.test.cjs tests/pathPointGesture.test.cjs tests/pathNodeDragReadScope.test.cjs tests/pathSegmentTargets.test.cjs tests/pathClosestSegment.test.cjs tests/pathHandleModifiers.test.cjs tests/pathHandleHit.test.cjs tests/pathTopologyRendererPolicy.test.cjs tests/pdfDenseInspectorDisplay.test.cjs tests/isolationTransformTarget.test.cjs tests/isolationAvailability.test.cjs
      - run: node --test tests/scientificAssetPreviewDraft.test.cjs tests/scientificAssetColorControls.test.cjs
      - run: python scripts/check-style-preview-browser.py --help
      - run: python scripts/geometry_qa/qualify.py --help
      - run: python scripts/geometry_qa/source-cases.py --help
      - run: python scripts/geometry_qa/topology.py --help
      - run: python scripts/geometry_qa/crowded-anchors.py --help
      - run: python scripts/geometry_qa/final-counts.py --help
      - run: python scripts/geometry_qa/pdf-topology.py --help
      - run: python -m pytest -q tests/test_figure_tool_package_producer.py tests/test_scientific_product_release.py tests/test_scientific_product_release_expansion_20261103.py tests/test_export_figure_release_source.py tests/test_vendor_source_tools.py tests/test_vendor_fabric_portability.py
