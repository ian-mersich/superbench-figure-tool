<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Kinesin Cargo Transport</title>
  <desc id="desc">Illustrative kinesin-1-like motor with compact microtubule-binding heads and a stalk linking to a generic vesicular cargo.</desc>
  <g data-region="microtubule" fill="#B8B5FF" stroke="none">
    <rect x="18" y="93" width="92" height="8" rx="3"/><rect x="18" y="104" width="92" height="8" rx="3"/>
  </g>
  <g data-region="motor" fill="#5EA9DD" stroke="none">
    <path d="M61 49H67V74L79 82L76 88L64 80L48 88L44 83L61 73Z"/><path d="M39 82C45 79 54 82 54 87C54 92 46 95 40 92C35 92 34 86 39 82Z"/><path d="M75 82C81 79 90 82 90 87C90 92 82 95 76 92C71 92 70 86 75 82Z"/>
  </g>
  <g data-region="cargo" fill="#F4A261" stroke="none">
    <ellipse cx="64" cy="35" rx="20" ry="17"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="93" width="92" height="8" rx="3"/><rect x="18" y="104" width="92" height="8" rx="3"/><path d="M31 94V100M44 94V100M57 94V100M70 94V100M83 94V100M96 94V100M25 105V111M38 105V111M51 105V111M64 105V111M77 105V111M90 105V111M103 105V111" stroke-width="2.75"/><path d="M61 49H67V74L79 82L76 88L64 80L48 88L44 83L61 73Z"/><path d="M39 82C45 79 54 82 54 87C54 92 46 95 40 92C35 92 34 86 39 82Z"/><path d="M75 82C81 79 90 82 90 87C90 92 82 95 76 92C71 92 70 86 75 82Z"/><ellipse cx="64" cy="35" rx="20" ry="17"/><path d="M62 58L66 62M62 67L66 71" stroke-width="2.75"/>
  </g>
</svg>
