<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">COPII — Detached Carrier</title>
  <desc id="desc">A closed COPII carrier with separately editable membrane, luminal cargo, inner coat and open outer cage.</desc>
