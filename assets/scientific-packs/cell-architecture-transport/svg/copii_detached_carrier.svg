    <path d="M34 65a30 30 0 1 0 60 0a30 30 0 1 0 -60 0ZM41 65a23 23 0 1 0 46 0a23 23 0 1 0 -46 0Z" fill-rule="evenodd"/><ellipse cx="56" cy="61" rx="8" ry="8"/><ellipse cx="74" cy="72" rx="6" ry="6"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(0 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(60 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(120 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(180 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(240 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(300 64 65)"/><path d="M21 45L42 19H80L107 46L104 85L80 109H43L19 82Z M28 48L46 26H77L100 49L97 81L77 102H46L26 79Z" fill-rule="evenodd"/>
