    <ellipse cx="56" cy="61" rx="8" ry="8"/><ellipse cx="74" cy="72" rx="6" ry="6"/>
  </g>
  <g data-region="inner_coat" fill="#F4A261" stroke="none">
    <ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(0 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(60 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(120 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(180 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(240 64 65)"/><ellipse cx="64" cy="32" rx="6" ry="4" transform="rotate(300 64 65)"/>
  </g>
