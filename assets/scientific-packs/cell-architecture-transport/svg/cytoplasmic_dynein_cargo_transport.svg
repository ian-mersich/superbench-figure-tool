<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Cytoplasmic Dynein Cargo Transport</title>
  <desc id="desc">Illustrative cytoplasmic dynein transport complex with paired AAA+ motor rings, microtubule-binding stalks and a simplified tail-associated adaptor complex linking to generic vesicular cargo.</desc>
