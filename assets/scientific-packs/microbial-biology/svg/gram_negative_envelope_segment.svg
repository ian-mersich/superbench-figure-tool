  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 26Q64 20 110 26V40Q64 34 18 40Z"/><path d="M18 82Q64 76 110 82V96Q64 90 18 96Z"/><path d="M30 26V36M48 24V34M66 24V34M84 24V34M102 26V36M30 82V92M48 80V90M66 80V90M84 80V90M102 82V92" stroke-width="2"/>
