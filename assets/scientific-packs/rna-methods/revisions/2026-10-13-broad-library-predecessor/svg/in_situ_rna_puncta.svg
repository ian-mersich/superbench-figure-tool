<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative In-situ RNA Puncta Field</title>
  <desc id="desc">Original editable schematic of an RNA fluorescence in situ hybridization field, with cell context, nuclei, and illustrative RNA-associated puncta. This is not a microscopy image or measured dataset. Dot numbers, positions, colors, and sizes do not encode expression levels, molecule counts, a named target, or a physical scale.</desc>
  <g data-region="cell_context" fill="#D9F4E5" stroke="none">
    <path d="M25 33c1-10 12-14 22-10 11-3 19 5 18 16 3 10-4 19-14 20-10 5-24-1-25-11-5-5-5-10-1-15z"/>
    <path d="M76 30c10-5 23 1 24 11 7 8 2 21-8 24-10 4-22-2-22-12-5-8-1-19 6-23z"/>
    <path d="M45 74c8-8 22-6 27 2 12 1 18 14 11 23-6 11-20 11-28 5-12-1-18-10-14-20-1-4 0-7 4-10z"/>
  </g>
  <g data-region="nuclei" fill="#B8B5FF" stroke="none">
    <ellipse cx="43" cy="39" rx="7.5" ry="9" transform="rotate(-15 43 39)"/>
    <ellipse cx="86" cy="47" rx="7" ry="8" transform="rotate(18 86 47)"/>
    <ellipse cx="62" cy="89" rx="8" ry="7" transform="rotate(-12 62 89)"/>
  </g>
  <g data-region="rna_puncta" fill="#E76F51" stroke="none">
    <circle cx="30" cy="36" r="2.6"/><circle cx="32" cy="49" r="2.6"/><circle cx="53" cy="30" r="2.6"/><circle cx="55" cy="46" r="2.6"/>
    <circle cx="79" cy="35" r="2.6"/><circle cx="75" cy="51" r="2.6"/><circle cx="96" cy="53" r="2.6"/>
    <circle cx="49" cy="82" r="2.6"/><circle cx="51" cy="98" r="2.6"/><circle cx="69" cy="77" r="2.6"/><circle cx="76" cy="89" r="2.6"/><circle cx="69" cy="101" r="2.6"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="16" width="96" height="96" rx="10"/>
    <path d="M25 33c1-10 12-14 22-10 11-3 19 5 18 16 3 10-4 19-14 20-10 5-24-1-25-11-5-5-5-10-1-15zM76 30c10-5 23 1 24 11 7 8 2 21-8 24-10 4-22-2-22-12-5-8-1-19 6-23zM45 74c8-8 22-6 27 2 12 1 18 14 11 23-6 11-20 11-28 5-12-1-18-10-14-20-1-4 0-7 4-10z" stroke-width="2.75"/>
    <ellipse cx="43" cy="39" rx="7.5" ry="9" transform="rotate(-15 43 39)" stroke-width="2.75"/>
    <ellipse cx="86" cy="47" rx="7" ry="8" transform="rotate(18 86 47)" stroke-width="2.75"/>
    <ellipse cx="62" cy="89" rx="8" ry="7" transform="rotate(-12 62 89)" stroke-width="2.75"/>
  </g>
</svg>
