<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Microfluidic Cell Partition</title>
  <desc id="desc">Original editable plan-view schematic of an aqueous cell suspension meeting an oil stream at a microfluidic junction and forming separated droplets. One occupied and one empty droplet illustrate partitioning without implying guaranteed single-cell occupancy, device dimensions, or a quantitative yield.</desc>
  <g data-region="chip_body" fill="#E8EEF7" stroke="none">
    <rect x="16" y="16" width="96" height="96" rx="10"/>
  </g>
  <g data-region="oil_phase" fill="#8EC8FF" stroke="none">
    <path d="M57 16h14v34h41v28H71v34H57V76l-7-6H16V58h34l7-6z"/>
  </g>
  <g data-region="aqueous_partition" fill="#C7F2EC" stroke="none">
    <path d="M16 58h35c4 0 8 2 11 6-3 4-7 6-11 6H16z"/>
    <rect x="70" y="56" width="18" height="16" rx="8"/>
    <rect x="93" y="56" width="15" height="16" rx="7.5"/>
  </g>
  <g data-region="cell" fill="#B8B5FF" stroke="none">
    <circle cx="30" cy="64" r="3.5"/>
    <circle cx="47" cy="64" r="3.5"/>
    <circle cx="79" cy="64" r="3.5"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="16" width="96" height="96" rx="10"/>
    <path d="M57 18v34l-7 6H18m53-40v32h39M18 70h32l7 6v34m14 0V78h39"/>
    <path d="M51 58c4 0 8 2 11 6-3 4-7 6-11 6" stroke-width="2.75"/>
    <rect x="70" y="56" width="18" height="16" rx="8" stroke-width="2.75"/>
    <rect x="93" y="56" width="15" height="16" rx="7.5" stroke-width="2.75"/>
    <circle cx="30" cy="64" r="3.5" stroke-width="2.75"/>
    <circle cx="47" cy="64" r="3.5" stroke-width="2.75"/>
    <circle cx="79" cy="64" r="3.5" stroke-width="2.75"/>
    <path d="M64 30v11m-4-4 4 4 4-4M64 98V87m-4 4 4-4 4 4" stroke-width="2.75"/>
  </g>
</svg>
