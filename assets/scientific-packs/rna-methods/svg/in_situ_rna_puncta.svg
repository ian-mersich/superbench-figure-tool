<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Illustrative RNA-FISH Field</title>
<desc id="desc">Original constructed RNA-FISH illustration showing cell boundaries, nuclear context and RNA-probe-associated puncta. Not microscopy or measured data: dot numbers, positions, colors and sizes do not encode molecule counts, expression, a named target or physical scale.</desc>
<g data-region="cell_context" fill="#D9F4E5" stroke="none"><path d="M22 35c3-13 17-18 29-12 12 0 18 12 13 23-1 13-15 20-26 14-12 0-21-13-16-25z"/><path d="M77 29c11-4 23 3 23 14 6 12-2 24-15 24-12 2-20-10-15-21-2-7 1-13 7-17z"/><path d="M45 78c8-9 23-10 32-1 13 3 16 17 7 27-9 9-22 7-31 1-11-2-16-16-8-27z"/></g>
<g data-region="nuclei" fill="#B8B5FF" stroke="none"><ellipse cx="43" cy="40" rx="8" ry="9" transform="rotate(-17 43 40)"/><ellipse cx="85" cy="46" rx="7" ry="9" transform="rotate(15 85 46)"/><ellipse cx="65" cy="90" rx="9" ry="7" transform="rotate(12 65 90)"/></g>
<g data-region="rna_puncta" fill="#E76F51" stroke="none"><circle cx="29" cy="34" r="2.7"/><circle cx="29" cy="50" r="2.7"/><circle cx="54" cy="32" r="2.7"/><circle cx="55" cy="48" r="2.7"/><circle cx="77" cy="34" r="2.7"/><circle cx="75" cy="54" r="2.7"/><circle cx="96" cy="53" r="2.7"/><circle cx="50" cy="84" r="2.7"/><circle cx="54" cy="101" r="2.7"/><circle cx="72" cy="78" r="2.7"/><circle cx="82" cy="93" r="2.7"/><circle cx="72" cy="104" r="2.7"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="15" width="98" height="98" rx="9"/><path d="M22 35c3-13 17-18 29-12 12 0 18 12 13 23-1 13-15 20-26 14-12 0-21-13-16-25z"/><path d="M77 29c11-4 23 3 23 14 6 12-2 24-15 24-12 2-20-10-15-21-2-7 1-13 7-17z"/><path d="M45 78c8-9 23-10 32-1 13 3 16 17 7 27-9 9-22 7-31 1-11-2-16-16-8-27z"/><ellipse cx="43" cy="40" rx="8" ry="9" transform="rotate(-17 43 40)"/><ellipse cx="85" cy="46" rx="7" ry="9" transform="rotate(15 85 46)"/><ellipse cx="65" cy="90" rx="9" ry="7" transform="rotate(12 65 90)"/></g>
