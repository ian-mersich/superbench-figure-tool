<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Oligo-barcoded RNA Capture Bead</title>
<desc id="desc">Original capture-bead schematic with six illustrative oligonucleotide tethers. Shared barcode segments match; molecular-identifier segment shapes vary; terminal segments indicate poly(dT) capture. Shapes are not nucleotide sequences and tether count does not encode oligonucleotide density.</desc>
<g data-region="bead_body" fill="#8EC8FF" stroke="none"><circle cx="64" cy="64" r="26"/></g>
<g data-region="cell_barcode" fill="none" stroke="#7B78C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M64 37V27" transform="rotate(0 64 64)"/><path d="M64 37V27" transform="rotate(60 64 64)"/><path d="M64 37V27" transform="rotate(120 64 64)"/><path d="M64 37V27" transform="rotate(180 64 64)"/><path d="M64 37V27" transform="rotate(240 64 64)"/><path d="M64 37V27" transform="rotate(300 64 64)"/></g>
<g data-region="molecular_identifier" fill="none" stroke="#F4A261" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M64 27l-3-4 3-4" transform="rotate(0 64 64)"/><path d="M64 27l3-4-3-4" transform="rotate(60 64 64)"/><path d="M64 27l-2-3 4-3-2-2" transform="rotate(120 64 64)"/><path d="M64 27l2-3-4-3 2-2" transform="rotate(180 64 64)"/><path d="M64 27l-3-2 3-3-2-3" transform="rotate(240 64 64)"/><path d="M64 27l3-2-3-3 2-3" transform="rotate(300 64 64)"/></g>
<g data-region="polydt_capture_tail" fill="none" stroke="#7DD3C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(0 64 64)"/><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(60 64 64)"/><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(120 64 64)"/><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(180 64 64)"/><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(240 64 64)"/><path d="M64 19v-7m-3 2h6m-6 3h6" transform="rotate(300 64 64)"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="64" r="26"/><path d="M64 42v-5" transform="rotate(0 64 64)"/><path d="M64 42v-5" transform="rotate(60 64 64)"/><path d="M64 42v-5" transform="rotate(120 64 64)"/><path d="M64 42v-5" transform="rotate(180 64 64)"/><path d="M64 42v-5" transform="rotate(240 64 64)"/><path d="M64 42v-5" transform="rotate(300 64 64)"/></g>
</svg>
