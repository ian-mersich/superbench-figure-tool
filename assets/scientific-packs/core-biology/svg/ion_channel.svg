<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ion Channel</title>
  <desc id="desc">Original vector ion channel with a continuous aqueous pore, paired channel walls, membrane bilayer, permeating ions, and editable semantic regions.</desc>

