<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">siRNA Duplex</title>
  <desc id="desc">Original vector short interfering RNA duplex with antiparallel strands, paired bases, two-nucleotide overhangs, and editable semantic regions.</desc>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 49c18-5 57-5 76 0M27 79c18 5 57 5 76 0" stroke-width="8"/>
    <path d="m34 48 2 32m12-34 2 36m12-37 2 38m12-38 2 37m12-35 2 33" stroke-width="5.25"/>
    <g stroke-width="2.25">
      <circle cx="17" cy="49" r="3.2"/><circle cx="17" cy="58" r="3.2"/>
      <circle cx="113" cy="71" r="3.2"/><circle cx="113" cy="80" r="3.2"/>
    </g>
  </g>
  <path data-region="sense" fill="none" stroke="#5EA9DD" stroke-linecap="round" stroke-width="4.5" d="M25 49c18-5 57-5 76 0"/>
  <path data-region="antisense" fill="none" stroke="#7B78C9" stroke-linecap="round" stroke-width="4.5" d="M27 79c18 5 57 5 76 0"/>
  <g data-region="overhang" fill="#F4A261">
    <circle cx="17" cy="49" r="3.2"/><circle cx="17" cy="58" r="3.2"/>
    <circle cx="113" cy="71" r="3.2"/><circle cx="113" cy="80" r="3.2"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-width="2.25">
    <path d="m34 48 2 32m12-34 2 36m12-37 2 38m12-38 2 37m12-35 2 33"/>
  </g>
</svg>
