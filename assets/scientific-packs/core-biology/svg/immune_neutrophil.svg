    <path d="M69 30c10-5 22 0 25 10 3 10-4 20-14 22-11 3-21-4-22-14-1-8 4-15 11-18z"/>
    <path d="M67 69c9-7 22-4 27 6 5 10 0 22-10 27-11 5-23-1-26-12-3-8 1-16 9-21z"/>
