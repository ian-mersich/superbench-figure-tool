    <path stroke-width="2.7" d="M64 23c23-1 42 16 44 39 2 24-14 44-38 47-24 3-45-12-50-35-4-24 11-46 35-51h9z"/>
    <path stroke-width="1.5" d="M64 29c20-1 36 14 38 33 2 20-12 37-33 40-20 2-38-11-42-30-3-20 10-39 29-43h8z"/>
    <circle cx="48" cy="62" r="5" stroke-width="1.6"/>
    <circle cx="74" cy="78" r="4.5" stroke-width="1.6"/>
    <path stroke-width="1.6" d="M69 44c5-4 13-2 15 3 2 5-2 10-7 11-5 1-10-2-11-6-1-3 0-6 3-8z"/>
  </g>
</svg>
