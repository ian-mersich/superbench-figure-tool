    <path stroke-width="5" d="M64 23c23-1 42 16 44 39 2 24-14 44-38 47-24 3-45-12-50-35-4-24 11-46 35-51h9z"/>
    <path stroke-width="1.8" d="M64 29c20-1 36 14 38 33 2 20-12 37-33 40-20 2-38-11-42-30-3-20 10-39 29-43h8z"/>
  </g>

