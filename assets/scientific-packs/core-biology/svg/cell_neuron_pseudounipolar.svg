<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Pseudounipolar Sensory Neuron — Schematic</title>
  <desc id="desc">Original pseudounipolar morphology with the soma outside the through-path, attached by one stem to a continuous T-junction. The two lateral branches are axonal; no transport direction, regenerative state or measured caliber is asserted.</desc>

