  <g data-region="neurite" fill="none" stroke="#7DD3C7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 42H112M68 42L68 67"/></g>
  <path data-region="nucleus" fill="#B8B5FF" d="M57 88C57 81 63 77 70 78C78 79 82 84 81 91C80 99 74 102 67 101C60 100 56 95 57 88Z"/>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
