<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Feedback Loop</title>
  <desc id="desc">Original vector negative-feedback loop with distinct upstream and downstream nodes, a forward activating arrow, and a return connector terminating at an inhibitory T-bar.</desc>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41 48h45M80 39l10 9-10 9"/>
    <path d="M99 65c-5 31-61 37-70 4"/>
    <path d="M19 71h20"/>
  </g>
  <g data-region="arrow" fill="none" stroke="#7DD3C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41 48h45M80 39l10 9-10 9"/>
  </g>
  <g data-region="signal" fill="#F7F9FC" stroke="#8EC8FF" stroke-width="4">
    <circle cx="28" cy="48" r="12"/><circle cx="100" cy="48" r="12"/>
    <path d="M99 65c-5 31-61 37-70 4" fill="none" stroke-linecap="round"/>
  </g>
  <path data-region="block" d="M19 71h20" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round"/>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.8">
    <circle cx="28" cy="48" r="12"/><circle cx="100" cy="48" r="12"/>
    <circle cx="28" cy="48" r="3" fill="#26323D"/>
    <circle cx="100" cy="48" r="3" fill="#26323D"/>
  </g>
</svg>
