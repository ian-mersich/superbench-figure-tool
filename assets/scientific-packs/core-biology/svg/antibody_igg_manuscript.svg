<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">IgG Antibody</title>
  <desc id="desc">Original IgG schematic with two continuous heavy chains, one shorter light chain per arm, a hinge and two antigen-binding tips. Symbolic configuration; no fixed conformation, subclass, affinity or activity is implied.</desc>
  <g data-region="outline" fill="none" stroke="#66707A" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M58 104V82c0-12-3-19-11-28L30 31"/><path d="M70 104V82c0-12 3-19 11-28l17-23"/><path d="M42 65 19 42"/><path d="M86 65l23-23"/><path d="M57 73h14M57 80h14"/><path d="M19 42 30 31"/><path d="M98 31l11 11"/>
  </g>
  <g data-region="heavy_chain" fill="none" stroke="#7E9DB2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M58 104V82c0-12-3-19-11-28L30 31"/><path d="M70 104V82c0-12 3-19 11-28l17-23"/>
  </g>
  <g data-region="light_chain" fill="none" stroke="#B8B5FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M42 65 19 42"/><path d="M86 65l23-23"/>
  </g>
  <g data-region="hinge" fill="none" stroke="#9D95C8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M57 73h14M57 80h14"/>
  </g>
  <g data-region="binding_tip" fill="none" stroke="#C58F8C" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M19 42 30 31"/><path d="M98 31l11 11"/>
  </g>
</svg>
