  <rect data-region="label" x="43" y="43" width="42" height="21" rx="4" fill="#F7F9FC"/>

  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="3.4" d="M40 31h48v63c0 15-10 25-24 25S40 109 40 94z"/>
    <rect x="34" y="14" width="60" height="20" rx="6" stroke-width="3.2"/>
