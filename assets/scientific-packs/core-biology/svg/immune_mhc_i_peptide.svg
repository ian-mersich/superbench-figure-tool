<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">MHC-I Peptide Complex</title>
  <desc id="desc">Original vector MHC class I peptide complex with a single membrane-anchored heavy chain, peptide-binding platform, beta-2-microglobulin-like side domain, short peptide, and editable semantic regions.</desc>

  <g data-region="membrane" fill="#C7F2EC">
    <rect x="14" y="91" width="100" height="8" rx="4"/>
    <rect x="14" y="104" width="100" height="8" rx="4"/>
  </g>

  <g data-region="mhc" fill="#8EC8FF">
    <path d="M38 43c0-10 8-18 18-18 7 0 12 4 15 9 3-5 8-9 15-9 10 0 18 8 18 18 0 9-7 16-16 17H55c-10 0-17-8-17-17z"/>
    <path d="M59 58c0-8 6-14 14-14 9 0 15 7 15 15 0 7-4 12-10 14v39H66V73c-5-2-7-8-7-15z"/>
  </g>

  <path data-region="beta2m" fill="#B8B5FF" d="M36 60c4-7 13-9 20-5 7 4 9 12 5 19-4 7-13 9-20 5-7-4-9-12-5-19z"/>

  <path data-region="peptide" fill="none" stroke="#F4A261" stroke-linecap="round" stroke-width="5" d="M48 33c8-4 18-4 27 0 7 3 13 3 19-1"/>

  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2.6" d="M14 95h100M14 108h100"/>
    <path stroke-width="3" d="M38 43c0-10 8-18 18-18 7 0 12 4 15 9 3-5 8-9 15-9 10 0 18 8 18 18 0 9-7 16-16 17H55c-10 0-17-8-17-17zM59 58c0-8 6-14 14-14 9 0 15 7 15 15 0 7-4 12-10 14v39H66V73c-5-2-7-8-7-15z"/>
    <path stroke-width="2.4" d="M36 60c4-7 13-9 20-5 7 4 9 12 5 19-4 7-13 9-20 5-7-4-9-12-5-19z"/>
  </g>
</svg>
