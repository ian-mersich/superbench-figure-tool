<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ligand-bound Single-pass Receptor</title>
  <desc id="desc">Original generic single-pass receptor with an extracellular binding region, one continuous membrane-spanning segment and a cytoplasmic tail. A separate symbolic ligand contacts the extracellular region. No named receptor structure, activity or scale is implied.</desc>
