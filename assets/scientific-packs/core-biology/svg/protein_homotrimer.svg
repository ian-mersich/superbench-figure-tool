<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Protein Homotrimer</title>
  <desc id="desc">Three matching schematic subunits in contact, arranged as one generic homotrimer. Repeated shapes indicate identical subunits; no named assembly, atomic interface or central active site is asserted.</desc>
  <g data-region="subunit" fill="#8EC8FF" stroke="none">
    <path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(0 64 64)"/><path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(120 64 64)"/><path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(240 64 64)"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(0 64 64)"/><path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(120 64 64)"/><path d="M64 64c-12-3-25-11-27-23-2-13 9-24 22-23 13-1 24 8 28 19 4 12-7 23-23 27z" transform="rotate(240 64 64)"/>
  </g>
