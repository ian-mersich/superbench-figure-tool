<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Antibody Fab Fragment</title>
  <desc id="desc">One original antigen-binding Fab arm with heavy-chain and light-chain portions. The paired chains and binding end are schematic, not a named immunoglobulin structure.</desc>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round" stroke-width="12">
    <path d="M47 101 59 76l10-28 8-19"/><path d="M69 104 80 82l10-30 8-19"/><path d="M77 29 98 33"/>
  </g>
  <g data-region="heavy_chain" fill="none" stroke="#8EC8FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M47 101 59 76l10-28 8-19"/>
  </g>
  <g data-region="light_chain" fill="none" stroke="#B8B5FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M69 104 80 82l10-30 8-19"/>
  </g>
  <g data-region="binding_tip" fill="none" stroke="#F4A261" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <path d="M77 29 98 33"/>
  </g>
</svg>
