<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Generic Kinase Domain</title>
  <desc id="desc">Original connected unequal-lobed kinase domain schematic with an open catalytic cleft, a short peptide cue and a separate abstract phosphate symbol. No named structure, residue identity, reaction kinetics or measured activity is implied.</desc>
  <g data-region="body" fill="#8EC8FF" stroke="none">
    <path d="M29 52c-8-9-1-24 15-29 17-7 34 4 36 19 1 8-6 12-15 15l-17 5c0 7 7 11 14 7 14-8 32-4 43 10 14 19-1 38-23 37-27 2-50-17-49-37l1-18-5-9z"/>
  </g>
  <g data-region="active_site" fill="#5EA9DD" stroke="none">
    <path d="M43 56c8-5 18-6 27-3l-5 4-17 5 2 8-8-3 1-11z"/><circle cx="61" cy="63" r="3"/><circle cx="73" cy="63" r="3"/><circle cx="85" cy="63" r="3"/>
  </g>
  <g data-region="phosphate" fill="#F4A261" stroke="none">
    <circle cx="100" cy="63" r="5"/>
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M29 52c-8-9-1-24 15-29 17-7 34 4 36 19 1 8-6 12-15 15l-17 5c0 7 7 11 14 7 14-8 32-4 43 10 14 19-1 38-23 37-27 2-50-17-49-37l1-18-5-9z"/><path d="M57 63h31" stroke-width="2"/><circle cx="100" cy="63" r="5" stroke-width="2.5"/>
  </g>
</svg>
