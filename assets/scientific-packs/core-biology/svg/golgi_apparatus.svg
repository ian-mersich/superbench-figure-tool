<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Golgi Apparatus</title>
  <desc id="desc">Original vector Golgi apparatus with five curved cisternae, cis and trans face accents, budding vesicles, and editable semantic regions.</desc>

  <g data-region="cisterna" fill="#FFD7A8">
    <path d="M38 27c15-7 36-7 52 0 5 2 6 7 2 10-16-5-35-5-50 1-5 2-10-1-10-5 0-3 2-5 6-6z"/>
    <path d="M30 42c20-7 47-7 68 0 5 2 6 8 1 11-20-6-45-6-64 0-5 2-10-1-10-6 0-2 2-4 5-5z"/>
    <path d="M25 59c23-6 55-6 78 1 5 2 6 8 1 11-23-7-52-7-74-1-5 1-10-2-10-6 0-2 2-4 5-5z"/>
    <path d="M30 77c19 6 46 7 67 1 5-1 9 3 8 7-1 2-3 3-6 4-22 7-51 6-71-1-5-2-6-8-1-11 1 0 2 0 3 0z"/>
    <path d="M40 94c14 5 34 6 50 1 5-1 9 2 8 7 0 3-3 4-6 5-18 6-41 5-56-1-5-2-6-8-1-11 1-1 3-1 5-1z"/>
  </g>

  <g data-region="vesicle" fill="#C7F2EC">
    <circle cx="22" cy="43" r="5"/><circle cx="17" cy="73" r="6"/><circle cx="26" cy="102" r="4"/>
    <circle cx="107" cy="28" r="4.5"/><circle cx="112" cy="53" r="6"/><circle cx="111" cy="92" r="5"/>
  </g>

  <g data-region="accent" fill="none" stroke="#F4A261" stroke-linecap="round" stroke-width="3">
    <path d="M41 30c7-2 14-3 21-3"/><path d="M88 82c5-1 9-2 13-3"/><path d="M82 99c5-1 9-2 13-3"/>
  </g>

  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75">
    <path d="M38 27c15-7 36-7 52 0 5 2 6 7 2 10-16-5-35-5-50 1-5 2-10-1-10-5 0-3 2-5 6-6z"/>
    <path d="M30 42c20-7 47-7 68 0 5 2 6 8 1 11-20-6-45-6-64 0-5 2-10-1-10-6 0-2 2-4 5-5z"/>
    <path d="M25 59c23-6 55-6 78 1 5 2 6 8 1 11-23-7-52-7-74-1-5 1-10-2-10-6 0-2 2-4 5-5z"/>
    <path d="M30 77c19 6 46 7 67 1 5-1 9 3 8 7-1 2-3 3-6 4-22 7-51 6-71-1-5-2-6-8-1-11 1 0 2 0 3 0z"/>
    <path d="M40 94c14 5 34 6 50 1 5-1 9 2 8 7 0 3-3 4-6 5-18 6-41 5-56-1-5-2-6-8-1-11 1-1 3-1 5-1z"/>
    <circle cx="22" cy="43" r="5"/><circle cx="17" cy="73" r="6"/><circle cx="26" cy="102" r="4"/>
    <circle cx="107" cy="28" r="4.5"/><circle cx="112" cy="53" r="6"/><circle cx="111" cy="92" r="5"/>
  </g>
</svg>
