    <path stroke-width="3" d="M31 45c0-11 8-20 19-20 10 0 18 8 18 18 0 10-8 18-18 18-11 0-19-6-19-16zM39 64c0-8 7-15 15-15 9 0 16 7 16 16 0 7-4 12-10 14v33H48V79c-6-2-9-8-9-15zM60 43c0-10 8-18 18-18 11 0 19 9 19 20 0 10-8 16-19 16-10 0-18-8-18-18zM68 65c0-9 7-16 16-16 8 0 15 7 15 15 0 7-3 13-9 15v33H78V79c-6-2-10-7-10-14z"/>
  </g>
</svg>
