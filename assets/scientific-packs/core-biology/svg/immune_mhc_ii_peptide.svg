<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">MHC-II Peptide Complex</title>
  <desc id="desc">Original vector MHC class II peptide complex with two membrane-anchored chains, paired extracellular domains, an open peptide-binding groove, longer peptide, and editable semantic regions.</desc>

  <g data-region="membrane" fill="#C7F2EC">
    <rect x="14" y="91" width="100" height="8" rx="4"/>
    <rect x="14" y="104" width="100" height="8" rx="4"/>
  </g>

  <g data-region="mhc_alpha" fill="#8EC8FF">
    <path d="M31 45c0-11 8-20 19-20 10 0 18 8 18 18 0 10-8 18-18 18-11 0-19-6-19-16z"/>
    <path d="M39 64c0-8 7-15 15-15 9 0 16 7 16 16 0 7-4 12-10 14v33H48V79c-6-2-9-8-9-15z"/>
  </g>

  <g data-region="mhc_beta" fill="#B8B5FF">
    <path d="M60 43c0-10 8-18 18-18 11 0 19 9 19 20 0 10-8 16-19 16-10 0-18-8-18-18z"/>
    <path d="M68 65c0-9 7-16 16-16 8 0 15 7 15 15 0 7-3 13-9 15v33H78V79c-6-2-10-7-10-14z"/>
  </g>

