<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">DNA double helix</title>
  <desc id="desc">Original vector DNA double helix with crossing backbones, paired bases, terminal accents, and editable semantic regions.</desc>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 19c34 20 34 70 0 90M88 19c-34 20-34 70 0 90" stroke-width="8"/>
    <path d="M48 27 80 36M40 45l48 14M40 68l48 14M48 101l32-9" stroke-width="5.5"/>
    <circle cx="40" cy="19" r="4.5" stroke-width="2.5"/><circle cx="88" cy="19" r="4.5" stroke-width="2.5"/>
    <circle cx="40" cy="109" r="4.5" stroke-width="2.5"/><circle cx="88" cy="109" r="4.5" stroke-width="2.5"/>
  </g>
  <g data-region="base_pair" fill="none" stroke="#F4A261" stroke-linecap="round" stroke-width="3">
    <path d="M48 27 80 36"/>
    <path d="M40 45l48 14"/>
    <path d="M40 68l48 14"/>
    <path d="M48 101l32-9"/>
  </g>
  <g data-region="backbone" fill="none" stroke="#5EA9DD" stroke-linecap="round" stroke-width="4.5">
    <path d="M40 19c34 20 34 70 0 90"/>
    <path d="M88 19c-34 20-34 70 0 90"/>
  </g>
  <g data-region="accent" fill="#B8B5FF">
    <circle cx="40" cy="19" r="4.5"/><circle cx="88" cy="19" r="4.5"/>
    <circle cx="40" cy="109" r="4.5"/><circle cx="88" cy="109" r="4.5"/>
  </g>
</svg>
