  <g data-region="outline" fill="none" stroke="#66707A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 19c34 20 34 70 0 90M88 19c-34 20-34 70 0 90" stroke-width="4.4"/>
    <path d="M48 27 80 36M40 45l48 14M40 68l48 14M48 101l32-9" stroke-width="3"/>
    <circle cx="40" cy="19" r="4.5" stroke-width="1.5"/><circle cx="88" cy="19" r="4.5" stroke-width="1.5"/>
    <circle cx="40" cy="109" r="4.5" stroke-width="1.5"/><circle cx="88" cy="109" r="4.5" stroke-width="1.5"/>
  </g>

