<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Tumor-associated Neutrophil — Isolated cell</title>
<desc id="desc">A lobulated granulocyte shown alone or apposed to tumor-cell context. Tumor association and neutrophil functions require biological evidence. Granule color and lobulation do not classify suppressive, antitumor or other neutrophil states.</desc>
