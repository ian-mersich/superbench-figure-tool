<g data-region="granules" fill="#F4A261" stroke="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="46" cy="47" r="2"/><circle cx="76" cy="46" r="2"/><circle cx="43" cy="78" r="2"/><circle cx="83" cy="75" r="2"/><circle cx="70" cy="87" r="2"/><circle cx="60" cy="39" r="2"/></g>
