<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 91Q35 58 54 48Q73 41 113 32Q95 58 76 74Q59 84 14 91Z"/></g>
<g data-region="cytoskeleton" fill="none" stroke="#58B8AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M34 77Q54 65 89 48M36 83Q63 76 93 58"/></g>
<g data-region="nucleus" fill="#B8B5FF" stroke="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="64" cy="64" rx="15" ry="8"/></g>
