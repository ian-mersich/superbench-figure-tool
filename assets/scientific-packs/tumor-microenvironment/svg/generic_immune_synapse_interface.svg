<title id="title">Immune Synapse — Generic — Interface close-up</title>
<desc id="desc">Two apposed cell membranes with clustered receptor–ligand contact cues, in whole-cell or interface views. A generic cell-contact diagram. Receptor identity, spatial pattern and downstream response are unspecified; not every synapse forms a stable concentric bull’s-eye.</desc>
