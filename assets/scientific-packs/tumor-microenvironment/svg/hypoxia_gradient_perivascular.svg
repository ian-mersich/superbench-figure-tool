<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Hypoxia Gradient — Vessel-to-tissue</title>
<desc id="desc">Qualitative oxygen availability decreases with distance from a vessel or toward a spheroid core. Dots indicate relative oxygen availability only. Hypoxia severity, consumption, length scale and concentration are not measured; real gradients depend on perfusion, diffusion and cellular demand.</desc>
<g data-region="tissue" fill="#E8EEF7" stroke="none" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="29" width="82" height="67" rx="6"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="29" width="82" height="67" rx="6"/></g>
<g data-region="source" fill="#C7F2EC" stroke="none" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="24" width="13" height="77" rx="6"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="24" width="13" height="77" rx="6"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M32 104L104 104"/><path d="M99.74 106.61L104 104L99.74 101.39"/></g>
<g data-region="outline" fill="#26323D" stroke="none" stroke-linecap="round" stroke-linejoin="round"><text x="69" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="400">O2 high → low</text></g>
<g data-region="molecule" fill="#5EA9DD" stroke="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="34.4" cy="40" r="1.9"/><circle cx="37.6" cy="40" r="1.9"/><circle cx="35.4" cy="56" r="1.9"/><circle cx="38.6" cy="56" r="1.9"/><circle cx="34.4" cy="72" r="1.9"/><circle cx="37.6" cy="72" r="1.9"/><circle cx="35.4" cy="86" r="1.9"/><circle cx="38.6" cy="86" r="1.9"/><circle cx="46.4" cy="45" r="1.9"/><circle cx="49.6" cy="45" r="1.9"/><circle cx="48.4" cy="64" r="1.9"/><circle cx="51.6" cy="64" r="1.9"/><circle cx="47.4" cy="83" r="1.9"/><circle cx="50.6" cy="83" r="1.9"/><circle cx="63.4" cy="50" r="1.9"/><circle cx="66.6" cy="50" r="1.9"/><circle cx="62.4" cy="76" r="1.9"/><circle cx="65.6" cy="76" r="1.9"/><circle cx="80.4" cy="65" r="1.9"/><circle cx="83.6" cy="65" r="1.9"/></g>
