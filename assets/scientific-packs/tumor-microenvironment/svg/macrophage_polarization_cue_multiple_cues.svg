<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Macrophage Polarization Cue — Multiple environmental cues</title>
<desc id="desc">Incoming environmental signals around a macrophage, with one-cue and multiple-cue arrangements. Macrophage activation is context-dependent and multidimensional. The response cue is not a universal M1/M2 binary, a measured state transition or evidence of a fixed lineage.</desc>
