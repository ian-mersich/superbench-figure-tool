<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Hypoxia Gradient — Spheroid section</title>
<desc id="desc">Qualitative oxygen availability decreases with distance from a vessel or toward a spheroid core. Dots indicate relative oxygen availability only. Hypoxia severity, consumption, length scale and concentration are not measured; real gradients depend on perfusion, diffusion and cellular demand.</desc>
<g data-region="tissue" fill="#E8EEF7" stroke="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="42"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="42"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="1.3" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="27"/><circle cx="64" cy="62" r="13"/></g>
<g data-region="source" fill="none" stroke="#C7F2EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 27Q64 1 111 27"/></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M64 12L64 33"/><path d="M61.39 28.74L64 33L66.61 28.74"/></g>
