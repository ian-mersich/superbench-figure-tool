<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.neural_circuit.feedforward_chain"><title id="title">Neural circuit — Feedforward chain</title><desc id="desc">A generic series of neuronal nodes connected by directional arrows. Generic directional connectivity only; arrows show schematic information flow and make no claim about excitation, inhibition, cell identity, or measured activity.</desc><g data-region="connection" fill="none" stroke="#8EC8FF" stroke-width="4" stroke-linecap="round"><path d="M38 64 H51M76 64 H89"/></g><g data-region="arrow" fill="#F4A261"><path d="M39 59 L51 64 L39 69Z"/><path d="M77 59 L89 64 L77 69Z"/></g><g data-region="neuron" fill="#C7F2EC"><circle cx="26" cy="64" r="10.5"/><circle cx="64" cy="64" r="10.5"/><circle cx="102" cy="64" r="10.5"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="64" r="10.5"/><circle cx="64" cy="64" r="10.5"/><circle cx="102" cy="64" r="10.5"/></g></svg>