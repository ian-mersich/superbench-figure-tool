<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.axon_terminal.branched_terminals"><title id="title">Axon terminal — Branched terminals</title><desc id="desc">A terminal axon branch ending in several separate boutons. Terminal morphology only; does not assert target cell, transmitter, release probability, or synaptic effect.</desc><g data-region="axon" fill="#F4A261"><path d="M17 62 Q46 61 65 64 L77 48 Q84 40 94 43 L103 49 Q107 54 101 58 L83 67 L98 80 Q104 85 98 91 Q89 97 81 89 L66 73 Q45 76 17 74Z"/></g><g data-region="terminal" fill="#F4A261"><circle cx="96" cy="51" r="10"/><circle cx="96" cy="88" r="10"/></g><g data-region="vesicles" fill="#FFFFFF"><circle cx="95" cy="50" r="3.5"/><circle cx="99" cy="55" r="3.5"/><circle cx="95" cy="87" r="3.5"/><circle cx="99" cy="92" r="3.5"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 62 Q46 61 65 64 L77 48 Q84 40 94 43 L103 49 Q107 54 101 58 L83 67 L98 80 Q104 85 98 91 Q89 97 81 89 L66 73 Q45 76 17 74Z"/><circle cx="96" cy="51" r="10"/><circle cx="96" cy="88" r="10"/><circle cx="95" cy="50" r="3.5" stroke-width="1.5"/><circle cx="99" cy="55" r="3.5" stroke-width="1.5"/><circle cx="95" cy="87" r="3.5" stroke-width="1.5"/><circle cx="99" cy="92" r="3.5" stroke-width="1.5"/></g></svg>