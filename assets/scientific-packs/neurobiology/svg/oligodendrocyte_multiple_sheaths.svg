<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.oligodendrocyte.multiple_sheaths"><title id="title">Oligodendrocyte — Multiple sheaths</title><desc id="desc">One oligodendrocyte soma connects through distinct processes to sheaths on several axons. Generic CNS oligodendrocyte topology; sheath count and process lengths are illustrative, not quantitative.</desc><g data-region="myelin" fill="#8EC8FF"><rect x="70" y="20" width="35" height="12" rx="6"/><rect x="73" y="56" width="34" height="12" rx="6"/><rect x="69" y="94" width="37" height="12" rx="6"/></g><g data-region="cell_feature" fill="none" stroke="#D9D7FF" stroke-width="8" stroke-linecap="round"><path d="M52 57 Q65 43 76 27M56 64 Q69 62 78 62M52 72 Q66 85 76 100"/></g><g data-region="cell_body" fill="#B8B5FF"><ellipse cx="39" cy="64" rx="18" ry="21"/><circle cx="39" cy="64" r="6" fill="#7B78C9"/></g><g data-region="axon" fill="#F4A261"><rect x="73" y="23" width="29" height="6" rx="3"/><rect x="76" y="59" width="28" height="6" rx="3"/><rect x="72" y="97" width="31" height="6" rx="3"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="39" cy="64" rx="18" ry="21"/><path d="M52 57 Q65 43 76 27M56 64 Q69 62 78 62M52 72 Q66 85 76 100"/><rect x="70" y="20" width="35" height="12" rx="6"/><rect x="73" y="56" width="34" height="12" rx="6"/><rect x="69" y="94" width="37" height="12" rx="6"/><rect x="73" y="23" width="29" height="6" rx="3" stroke-width="1.5"/><rect x="76" y="59" width="28" height="6" rx="3" stroke-width="1.5"/><rect x="72" y="97" width="31" height="6" rx="3" stroke-width="1.5"/></g></svg>