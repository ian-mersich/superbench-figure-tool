<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.schwann_cell.myelinating_internode"><title id="title">Schwann cell — Myelinating internode</title><desc id="desc">One Schwann cell wraps one axon segment between exposed paranodal ends. Generic peripheral glial topology; the second form is nonmyelinating and does not imply disease or axon loss.</desc><g data-region="myelin_wraps" fill="#8EC8FF"><rect x="34" y="43" width="59" height="43" rx="16"/></g><g data-region="periaxonal_space" fill="#FFFFFF"><rect x="38" y="52" width="51" height="25" rx="10"/></g><g data-region="cell_body" fill="#D9F4E5"><path d="M39 43 Q53 29 76 36 L91 44 Q79 40 74 46 L48 46Z"/><ellipse cx="64" cy="38" rx="10" ry="6"/></g><g data-region="axon" fill="#F4A261"><rect x="17" y="58" width="94" height="13" rx="6.5"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="43" width="59" height="43" rx="16"/><rect x="38" y="52" width="51" height="25" rx="10"/><rect x="17" y="58" width="94" height="13" rx="6.5"/><path d="M37 47 Q53 31 76 36 L91 44M48 46 Q63 43 77 46"/><ellipse cx="64" cy="38" rx="10" ry="6"/></g></svg>