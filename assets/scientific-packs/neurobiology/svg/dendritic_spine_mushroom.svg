<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.dendritic_spine.mushroom"><title id="title">Dendritic spine — Mushroom</title><desc id="desc">A relatively broad head on a short, wider neck rising from a dendritic shaft. Morphology classes are simplified schematic forms; real spine shapes vary continuously and are context dependent.</desc><g data-region="dendrite" fill="#C7F2EC"><path d="M18 72 Q60 68 110 72 L110 104 Q63 109 18 102Z"/></g><g data-region="spine" fill="#8EC8FF"><path d="M58 70 Q57 57 55 48 Q43 43 42 33 Q41 21 55 18 Q71 14 82 23 Q91 31 84 42 Q79 49 68 49 L68 70Z"/></g><g data-region="postsynaptic_density" fill="#F4A261"><path d="M72 22 Q84 25 85 34 Q84 41 77 44 L74 39 Q81 34 76 29Z"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 72 Q60 68 110 72 L110 104 Q63 109 18 102Z"/><path d="M58 70 Q57 57 55 48 Q43 43 42 33 Q41 21 55 18 Q71 14 82 23 Q91 31 84 42 Q79 49 68 49 L68 70Z"/><path d="M72 22 Q84 25 85 34 Q84 41 77 44"/></g></svg>