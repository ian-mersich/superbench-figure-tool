<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.axon_myelin.transverse"><title id="title">Myelinated axon — Transverse myelin ring</title><desc id="desc">A cross-section through an axon surrounded by concentric myelin lamellae. Schematic topology only; sheath thickness and spacing are not to scale and do not identify CNS or PNS origin.</desc><g data-region="myelin" fill="#8EC8FF"><circle cx="64" cy="64" r="39"/><circle cx="64" cy="64" r="31" fill="#FFFFFF"/><circle cx="64" cy="64" r="25" fill="#8EC8FF"/><circle cx="64" cy="64" r="18" fill="#FFFFFF"/></g><g data-region="periaxonal_space" fill="#D9F4E5"><circle cx="64" cy="64" r="16.5"/></g><g data-region="axon" fill="#F4A261"><circle cx="64" cy="64" r="12"/></g><g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5"><circle cx="64" cy="64" r="39"/><circle cx="64" cy="64" r="31"/><circle cx="64" cy="64" r="25"/><circle cx="64" cy="64" r="18"/><circle cx="64" cy="64" r="12"/></g></svg>