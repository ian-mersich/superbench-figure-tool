<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">UMAP Scatter — Continuous state example</title>
<desc id="desc">Editable UMAP-style examples with separated clusters or a continuous color ordering. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. UMAP axis values and apparent distances have no measured meaning here. Colors do not establish cell identities or lineage.</desc>
