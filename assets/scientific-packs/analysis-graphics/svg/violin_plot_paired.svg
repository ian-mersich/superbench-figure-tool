<title id="title">Violin Plot — Separate groups</title>
<desc id="desc">Editable symmetric distributions or a split violin, with a horizontal summary guide. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. Widths are hand-authored schematic density envelopes. The horizontal mark is a placeholder summary, not a calculated median or statistical comparison; no sample sizes are implied.</desc>
