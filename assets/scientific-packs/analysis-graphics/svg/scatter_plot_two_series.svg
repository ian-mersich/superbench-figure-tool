<title id="title">Scatter Plot — Two series</title>
<desc id="desc">Editable point clouds for one series with a guide or two distinct series. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. Axes lack numerical units. Any dashed trend is a hand-authored guide, not a fitted model, correlation estimate, confidence interval or causal relationship.</desc>
