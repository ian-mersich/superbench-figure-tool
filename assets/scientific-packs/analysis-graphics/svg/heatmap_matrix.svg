<title id="title">Heatmap — Value matrix</title>
<desc id="desc">Editable relative-value matrix with a labeled diverging key, optionally with a schematic column dendrogram. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. Features, sample values, scaling and clustering are unspecified. Colors are symbolic relative values; dendrogram branches have no inferred distance.</desc>
