<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Ferroptotic Cell — Schematic — Cell with lipid damage</title>
<desc id="desc">A cell with symbolic membrane lipid-damage marks and small compact mitochondrial cues. A mechanism-oriented schematic, not a diagnostic appearance. Colored marks mean illustrative lipid peroxidation, not a particular stain or iron count; ferroptosis requires appropriate biochemical, genetic or pharmacological evidence. Mitochondrial changes vary by model.</desc>
<g data-region="cytoplasm" id="cell-body-fill" fill="#C7F2EC"><path d="M101 43C112 65 100 93 79 104C55 116 28 100 21 80C12 57 29 28 51 23C73 15 91 24 101 43Z"/></g>
<g data-region="outline" id="cell-body-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M101 43C112 65 100 93 79 104C55 116 28 100 21 80C12 57 29 28 51 23C73 15 91 24 101 43Z"/></g>
