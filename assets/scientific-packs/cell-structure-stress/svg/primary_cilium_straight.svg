<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Primary Cilium — Straight projection</title>
<desc id="desc">A single membrane-covered ciliary projection above an apical surface, with an axonemal cue and basal body. A longitudinal primary-cilium schematic, not a motile cilia brush border. Microtubule number, ciliary pocket geometry, length, bending mechanics, transition zone and species are not specified.</desc>
<g data-region="cytoplasm" id="apical-cytoplasm-fill" fill="#C7F2EC"><path d="M17 88H111V112H17Z"/></g>
<g data-region="membrane" id="ciliary-membrane-fill" fill="#7DD3C7"><path d="M17 88H51V29Q51 16 62 16Q73 16 73 29V88H111V96H69V30Q69 23 62 23Q56 23 56 30V96H17Z"/></g>
<g data-region="outline" id="ciliary-membrane-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 88H51V29Q51 16 62 16Q73 16 73 29V88H111V96H69V30Q69 23 62 23Q56 23 56 30V96H17Z"/></g>
<g data-region="axoneme" id="axoneme-microtubules" fill="none" stroke="#8EC8FF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M59 33V90M65 33V90"/></g>
<g data-region="basal_body" id="basal-body-fill" fill="#B8B5FF"><rect x="51" y="96" width="19" height="12" rx="3"/></g>
<g data-region="outline" id="basal-body-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="51" y="96" width="19" height="12" rx="3"/></g>
<g data-region="outline" id="basal-body-longitudinal-cues" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M56 99V105M62 99V105M66 99V105"/></g>
</svg>
