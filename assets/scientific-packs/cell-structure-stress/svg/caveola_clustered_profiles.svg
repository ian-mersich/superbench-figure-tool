<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Caveola — Clustered profiles</title>
<desc id="desc">One surface-connected caveolar invagination beside neighboring caveolar profiles. A generic caveolar morphology. Coat marks do not imply clathrin, caveolin stoichiometry or a fully detached vesicle; neighboring profiles do not establish their three-dimensional connectivity.</desc>
