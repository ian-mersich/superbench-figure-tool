<g data-region="membrane" id="surface-connected-caveola" fill="none" stroke="#7DD3C7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 30H48Q59 30 54 40Q41 47 43 62Q42 77 56 82Q71 86 79 72Q86 57 71 43Q66 30 78 30H111"/></g>
<g data-region="outline" id="flat-membrane-contours" fill="none" stroke="#26323D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 25H49M78 25H111M17 35H47M80 35H111"/></g>
<g data-region="membrane" id="neighboring-caveolar-profile-fill" fill="#7DD3C7"><circle cx="37" cy="90" r="16"/></g>
