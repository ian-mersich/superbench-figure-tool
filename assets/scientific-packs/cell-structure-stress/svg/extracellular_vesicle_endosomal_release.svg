<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Extracellular Vesicle — Endosomal release</title>
<desc id="desc">A multivesicular-endosome profile continuous with the plasma membrane, with internal and released vesicle cues. An isolated EV silhouette cannot establish endosomal biogenesis or justify calling an observed vesicle an exosome. Only the release form illustrates an endosomal-origin model. No size, marker specificity, cargo sequence, purity, subtype or uptake mechanism is asserted.</desc>
