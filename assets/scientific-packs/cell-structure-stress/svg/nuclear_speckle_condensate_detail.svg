<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Nuclear Speckle — Condensate detail</title>
<desc id="desc">A single irregular membraneless speckle with illustrative RNA–protein material. Speckle contours and internal marks are illustrative. They do not specify SON or SRRM2 localization, RNA sequence, active splicing events, or a measured number of bodies. The outline delimits a condensate, not a lipid membrane.</desc>
