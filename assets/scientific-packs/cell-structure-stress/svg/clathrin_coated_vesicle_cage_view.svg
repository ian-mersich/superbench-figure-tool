<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Clathrin-coated Vesicle — Cage view</title>
<desc id="desc">A polygonal clathrin-cage cue surrounding a closed membrane profile. A detached coated-vesicle schematic, distinct from the existing surface-connected endocytic pit. Cage polygon count, adaptor identity, cage topology, cargo and diameter are not molecularly resolved or measured.</desc>
<g data-region="membrane" id="vesicle-membrane-fill" fill="#7DD3C7"><circle cx="64" cy="64" r="38"/></g>
<g data-region="outline" id="vesicle-membrane-outline" fill="none" stroke="#26323D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="64" r="38"/></g>
<g data-region="lumen" id="lumen-view-fill" fill="#F7F9FC"><circle cx="64" cy="64" r="29"/></g>
<g data-region="coat" id="polygonal-clathrin-cage" fill="none" stroke="#5EA9DD" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M40 30L65 21L90 35L106 61L96 90L67 107L37 96L22 68L27 45Z M40 30L43 55L64 68L88 54L90 35 M22 68L43 55M37 96L45 78L64 68L83 80L96 90 M65 21L64 42L88 54L106 61 M45 78L43 55M83 80L88 54M67 107L64 91L45 78M64 91L83 80"/></g>
<g data-region="cargo" id="cargo-cue-fill" fill="#F4A261"><circle cx="64" cy="58" r="5"/></g>
</svg>
