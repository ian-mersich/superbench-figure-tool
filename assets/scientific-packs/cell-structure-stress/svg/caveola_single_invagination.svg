<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Caveola — Single invagination</title>
<desc id="desc">A flask-shaped plasma-membrane invagination with a narrow surface connection and caveolar coat cues. A generic caveolar morphology. Coat marks do not imply clathrin, caveolin stoichiometry or a fully detached vesicle; neighboring profiles do not establish their three-dimensional connectivity.</desc>
