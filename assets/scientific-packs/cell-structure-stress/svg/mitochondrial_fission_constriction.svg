<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Mitochondrial Fission — Constriction</title>
<desc id="desc">An elongated mitochondrion narrowed at a central division-machinery cue. A generic division event, not complete DRP1, actin or ER-contact anatomy. Ring geometry, cristae number, mtDNA partitioning, fragment size, rates and stress or death outcomes are not specified. Separation is shown as a state rather than a measured motion.</desc>
