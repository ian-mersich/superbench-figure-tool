<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Pyroptotic Cell — Schematic — Pore-bearing cell</title>
<desc id="desc">A swollen cell bearing several symbolic gasdermin pore rings. Gasdermin ring symbols communicate a mechanism, not microscopy-resolved pore number, scale, subunit count or a diagnostic morphology. The drawing does not specify inflammatory caspase, gasdermin family member, cytokine identity or experimental evidence.</desc>
