<g data-region="outline" id="cell-body-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M99 39C112 55 109 85 91 101C72 117 42 110 27 94C11 76 17 48 33 30C51 12 83 19 99 39Z"/></g>
