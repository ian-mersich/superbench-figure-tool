<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">DNA Damage Foci — Dispersed foci</title>
<desc id="desc">A nuclear context containing dispersed illustrative DNA damage-response foci. Puncta are illustrative response-factor domains, not direct counts of DNA breaks, mutations or repair events. Gamma-H2AX, 53BP1 and yeast repair-factor patterns are not interchangeable measurements; the generic drawing assigns no marker identity or measured coordinates.</desc>
<g data-region="nucleus" id="nuclear-interior-fill" fill="#D9D7FF"><ellipse cx="64" cy="64" rx="43" ry="40"/></g>
<g data-region="outline" id="nuclear-interior-outline" fill="none" stroke="#26323D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="64" cy="64" rx="43" ry="40"/></g>
<g data-region="chromatin" id="chromatin-fiber-0" fill="none" stroke="#B8B5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M36 42q4-7 8 0q4 7 8 0"/></g>
<g data-region="chromatin" id="chromatin-fiber-1" fill="none" stroke="#B8B5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M70 46q4-7 8 0q4 7 8 0"/></g>
<g data-region="chromatin" id="chromatin-fiber-2" fill="none" stroke="#B8B5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M79 75q4-7 8 0q4 7 8 0"/></g>
<g data-region="chromatin" id="chromatin-fiber-3" fill="none" stroke="#B8B5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M42 83q4-7 8 0q4 7 8 0"/></g>
<g data-region="foci" id="damage-response-focus-0-fill" fill="#E76F51"><circle cx="43" cy="47" r="3.5"/></g>
<g data-region="foci" id="damage-response-focus-1-fill" fill="#E76F51"><circle cx="77" cy="69" r="3.5"/></g>
<g data-region="foci" id="damage-response-focus-2-fill" fill="#E76F51"><circle cx="55" cy="82" r="3.5"/></g>
<g data-region="foci" id="damage-response-focus-3-fill" fill="#E76F51"><circle cx="82" cy="42" r="3.5"/></g>
<g data-region="foci" id="damage-response-focus-4-fill" fill="#E76F51"><circle cx="34" cy="68" r="3.5"/></g>
</svg>
