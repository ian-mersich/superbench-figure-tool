<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Primary Cilium — Bent projection</title>
<desc id="desc">A curved primary cilium with continuous surface membrane, an axonemal cue and a basal body. A longitudinal primary-cilium schematic, not a motile cilia brush border. Microtubule number, ciliary pocket geometry, length, bending mechanics, transition zone and species are not specified.</desc>
<g data-region="cytoplasm" id="apical-cytoplasm-fill" fill="#C7F2EC"><path d="M17 88H111V112H17Z"/></g>
<g data-region="membrane" id="bent-ciliary-membrane-fill" fill="#7DD3C7"><path d="M17 88H48C49 68 61 58 72 46Q85 33 91 21Q96 13 103 18Q111 23 104 33Q95 49 82 60C66 75 63 82 62 88H111V96H56Q52 81 76 57Q91 43 98 29Q101 24 98 23Q93 35 78 50Q58 68 57 96H17Z"/></g>
<g data-region="outline" id="bent-ciliary-membrane-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 88H48C49 68 61 58 72 46Q85 33 91 21Q96 13 103 18Q111 23 104 33Q95 49 82 60C66 75 63 82 62 88H111V96H56Q52 81 76 57Q91 43 98 29Q101 24 98 23Q93 35 78 50Q58 68 57 96H17Z"/></g>
<g data-region="axoneme" id="bent-axoneme" fill="none" stroke="#8EC8FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M55 89C57 70 72 61 82 48Q95 34 97 27"/></g>
<g data-region="basal_body" id="basal-body-fill" fill="#B8B5FF"><rect x="51" y="96" width="19" height="12" rx="3"/></g>
<g data-region="outline" id="basal-body-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="51" y="96" width="19" height="12" rx="3"/></g>
<g data-region="outline" id="basal-body-longitudinal-cues" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M56 99V105M62 99V105M66 99V105"/></g>
</svg>
