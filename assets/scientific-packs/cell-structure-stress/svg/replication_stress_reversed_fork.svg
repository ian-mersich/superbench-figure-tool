<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Replication Stress — Reversed fork</title>
<desc id="desc">A replication-fork schematic with an additional paired nascent-strand arm at the junction. A DNA topology schematic, not sequence, replication speed, specific replisome proteins or a demonstrated cellular state. Fork reversal is one response to stress and is not inevitable; a stalled Y fork does not itself prove reversal or DNA breakage.</desc>
<g data-region="parent_dna" id="parental-fork-strands" fill="none" stroke="#8EC8FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 57H58L100 24M16 69H58L101 103"/></g>
<g data-region="nascent_dna" id="reversed-new-dna-arm" fill="none" stroke="#7B78C9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M68 53L102 32M68 76L101 95M60 59L87 59M60 67L87 67"/></g>
<g data-region="outline" id="reversed-arm-rung-0" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M64 60v6"/></g>
<g data-region="outline" id="reversed-arm-rung-1" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M70 60v6"/></g>
<g data-region="outline" id="reversed-arm-rung-2" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M76 60v6"/></g>
<g data-region="outline" id="reversed-arm-rung-3" fill="none" stroke="#26323D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M82 60v6"/></g>
<g data-region="stress_site" id="reversed-fork-junction-fill" fill="#E76F51"><circle cx="57" cy="63" r="5"/></g>
</svg>
