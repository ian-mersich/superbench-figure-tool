<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Necroptotic Cell — Schematic — Lytic cell</title>
<desc id="desc">An irregular swelling cell with membrane-associated MLKL cues, a breached border and released material. An MLKL-associated mechanism schematic. The clustered marks do not specify MLKL oligomer stoichiometry, a resolved pore structure, RIPK1 dependence or a diagnostic morphology; pathway identity requires independent evidence.</desc>
