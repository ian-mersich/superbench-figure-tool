<title id="title">Clathrin-coated Vesicle — Section with coat</title>
<desc id="desc">A detached closed vesicle membrane, internal cargo cues and a surrounding polygonal coat. A detached coated-vesicle schematic, distinct from the existing surface-connected endocytic pit. Cage polygon count, adaptor identity, cage topology, cargo and diameter are not molecularly resolved or measured.</desc>
