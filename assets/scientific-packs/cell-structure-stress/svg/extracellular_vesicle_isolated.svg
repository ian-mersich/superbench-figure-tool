<g data-region="membrane" id="surface-component-1" fill="none" stroke="#7DD3C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M94 41l-3-8"/></g>
<g data-region="membrane" id="surface-component-2" fill="none" stroke="#7DD3C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M103 72l-3-8"/></g>
<g data-region="membrane" id="surface-component-3" fill="none" stroke="#7DD3C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40 96l-3-8"/></g>
</svg>
