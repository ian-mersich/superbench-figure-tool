="round" /><path d="M61 43Q49 39 39 50Q29 63 35 76Q41 89 54 85Q60 80 61 72Q57 63 61 54Z" fill="none" stroke="#3C505B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g></svg>