<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.ovarian_follicle.eccentric_oocyte"><title id="title">Antral ovarian follicle — Eccentric oocyte section</title><desc id="desc">An eccentric oocyte with a distinct zona pellucida is surrounded by granulosa and borders the antral space; the outer theca forms a vascularized rim. Generic antral follicle section. Not to scale; does not specify species, cycle stage, or ovulatory readiness.</desc><g data-region="theca"><path d="M64 15A49 49 0 1 1 63.9 15 M64 22A42 42 0 1 0 64.1 22" fill="#9DC99F" fill-rule="evenodd"/></g><g data-region="vessel"><path d="M38 15Q24 25 15 41" fill="none" stroke="#C44D4D" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 15Q105 27 114 43" fill="none" stroke="#C44D4D" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 83Q24 103 43 114" fill="none" stroke="#C44D4D" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /><path d="M114 82Q104 102 85 114" fill="none" stroke="#C44D4D" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /></g><g data-region="granulosa"><path d="M64 24A40 40 0 1 1 63.9 24 M64 34A30 30 0 1 0 64.1 34" fill="#D5B5D8" fill-rule="evenodd"/></g><g data-region="antrum"><path d="M58 44Q76 38 89 50Q101 65 91 79Q78 91 62 82Q58 76 58 70Q55 57 58 44Z" fill="#E8F4F8" /></g><g data-region="oocyte"><ellipse cx="38" cy="70" rx="14" ry="14" fill="#E7B84D"/></g><g data-region="zona_pellucida"><ellipse cx="38" cy="70" rx="17" ry="17" fill="none" stroke="#FFFDF7" stroke-width="2.5"/></g><g data-region="outline"><path d="M64 15A49 49 0 1 1 63.9 15 M64 24A40 40 0 1 1 63.9 24" fill="none" stroke="#3C505B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 53A17 17 0 1 1 37.9 53" fill="none" stroke="#3C505B" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 44Q76 38 89 50Q101 65 91 79Q78 91 62 82Q58 76 58 70Q55 57 58 44Z" fill="none" stroke="#3C505B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" /></g></svg>