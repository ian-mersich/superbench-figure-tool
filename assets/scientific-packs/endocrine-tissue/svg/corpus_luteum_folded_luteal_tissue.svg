<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.corpus_luteum.folded_luteal_tissue"><title id="title">Corpus luteum — Folded luteal tissue</title><desc id="desc">Luteal cell cords and intervening capillary branches form a folded tissue field within a connective boundary. Generic luteal tissue. Does not distinguish granulosa- from theca-derived luteal cells, stage, species, or endocrine activity.</desc><g data-region="luteal"><path d="M20 30Q33 19 46 28Q55 34 48 44Q39 50 30 59Q22 67 18 59Q14 47 20 30Z" fill="#D9A27B" /><path d="M78 24Q91 20 102 31Q109 42 100 49Q91 53 82 45Q73 39 67 43Q67 31 78 24Z" fill="#D9A27B" /><path d="M18 77Q25 64 37 68Q47 72 48 84Q49 95 38 102Q25 103 19 94Q14 86 18 77Z" fill="#D9A27B" /><path d="M78 75Q87 65 99 70Q110 77 106 90Q102 102 89 103Q77 101 73 91Q71 83 78 75Z" fill="#D9A27B" /></g><g data-region="vessel"><path d="M16 24Q31 37 42 31T55 42Q45 53 34 59T18 73" fill="none" stroke="#C44D4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M68 20Q82 34 96 28T109 43Q98 55 85 47T61 50" fill="none" stroke="#C44D4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M17 68Q31 79 43 73T56 84Q47 98 31 104" fill="none" stroke="#C44D4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 70Q83 81 97 74T109 87Q101 101 86 105" fill="none" stroke="#C44D4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g data-region="antrum"><ellipse cx="64" cy="64" rx="9" ry="7" fill="#E8F4F8"/></g><g data-region="outline"><path d="M18 31Q33 17 49 27Q64 18 79 25Q99 19 108 39Q117 55 107 69Q114 86 98 100Q81 110 65 101Q47 111 30 99Q13 88 21 71Q11 52 18 31Z" fill="none" stroke="#3C505B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>