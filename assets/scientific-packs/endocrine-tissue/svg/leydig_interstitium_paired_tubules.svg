<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.leydig_interstitium.paired_tubules"><title id="title">Leydig-cell interstitium — Paired tubule profiles</title><desc id="desc">Two seminiferous-tubule cross-sections show a central lumen and surrounding epithelium; interstitial cell clusters and a small vessel lie between them. Location schematic only. Cell shape does not encode hormone production, developmental state, or cell identity beyond the named interstitial concept.</desc><g data-region="interstitium"><ellipse cx="61" cy="35" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="68" cy="44" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="59" cy="52" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="66" cy="60" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="60" cy="74" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="68" cy="83" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="60" cy="92" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="77" cy="50" rx="5.4" ry="6.5" fill="#D8C5A4"/><ellipse cx="76" cy="77" rx="5.4" ry="6.5" fill="#D8C5A4"/></g><g data-region="vessel"><path d="M61 29Q55 42 62 53T61 76Q68 89 62 101" fill="none" stroke="#C44D4D" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" /></g><g data-region="tubule"><path d="M13 64A21 15 0 1 0 55 64A21 15 0 1 0 13 64Z M18 64A16 11 0 1 1 50 64A16 11 0 1 1 18 64Z" fill="#D5B5D8" fill-rule="evenodd"/><path d="M74 64A20 14 0 1 0 114 64A20 14 0 1 0 74 64Z M79 64A15 10 0 1 1 109 64A15 10 0 1 1 79 64Z" fill="#D5B5D8" fill-rule="evenodd"/></g><g data-region="tubule_lumen"><ellipse cx="34" cy="64" rx="16" ry="11" fill="#FFF8E8"/><ellipse cx="94" cy="64" rx="15" ry="10" fill="#FFF8E8"/></g><g data-region="outline"><path d="M13 64A21 15 0 1 0 55 64A21 15 0 1 0 13 64Z" fill="none" stroke="#3C505B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M18 64A16 11 0 1 1 50 64A16 11 0 1 1 18 64Z" fill="none" stroke="#3C505B"