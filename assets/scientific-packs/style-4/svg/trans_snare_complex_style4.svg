<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Trans-SNARE Complex</title>
  <desc id="desc">A vesicle and separate target membrane connected by an illustrative four-helix SNARE bundle: three Q helices and one R helix.</desc>
  <g data-region="vesicle_membrane" fill="#8EC8FF" stroke="none">
    <path d="M44 35a21 21 0 1 0 42 0a21 21 0 1 0 -42 0ZM51 35a14 14 0 1 0 28 0a14 14 0 1 0 -28 0Z" fill-rule="evenodd" />
  </g>
  <g data-region="target_membrane" fill="#C7F2EC" stroke="none">
    <rect x="16" y="102" width="96" height="11" rx="4" />
  </g>
  <g data-region="q_snare" fill="#7DD3C7" stroke="none">
    <path d="M42 64Q45 62 48 64V107H42Z" /><path d="M54 64Q57 62 60 64V90H54Z" /><path d="M66 64Q69 62 72 64V90H66Z" /><rect x="54" y="88" width="18" height="5" rx="2" />
  </g>
  <g data-region="r_snare" fill="#E76F51" stroke="none">
    <path d="M78 46Q81 44 84 46V91H78Z" />
  </g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 35a21 21 0 1 0 42 0a21 21 0 1 0 -42 0ZM51 35a14 14 0 1 0 28 0a14 14 0 1 0 -28 0Z" fill-rule="evenodd" /><rect x="16" y="102" width="96" height="11" rx="4" /><path d="M42 64Q45 62 48 64V107H42Z" /><path d="M54 64Q57 62 60 64V90H54Z" /><path d="M66 64Q69 62 72 64V90H66Z" /><path d="M78 46Q81 44 84 46V91H78Z" /><rect x="54" y="88" width="18" height="5" rx="2" />
  </g>
</svg>