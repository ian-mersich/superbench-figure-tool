<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Drug Penetration Gradient — Spheroid penetration</title>
<desc id="desc">Qualitative drug availability decreases away from vascular supply or from an exposed spheroid rim. No dose, transport rate, penetration depth or efficacy is encoded. Actual distributions depend on compound, binding, metabolism, exposure time and tissue; limited penetration is not equivalent to cellular resistance.</desc>
