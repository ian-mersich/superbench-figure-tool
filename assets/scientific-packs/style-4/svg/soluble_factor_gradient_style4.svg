<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Soluble-factor Gradient</title>
  <desc id="desc">Editable soluble-factor concentration gradient schematic with constant-size soluble-factor marks decreasing in density away from a source.</desc>
  <g data-region="secreting_source" fill="#C7F2EC" stroke="none"><path d="M4 31c20 0 34 14 34 33S24 97 4 97z" /></g>
  <g data-region="high_concentration" fill="#E76F51" stroke="none"><circle cx="44" cy="40" r="4.5" /><circle cx="44" cy="54" r="4.5" /><circle cx="45" cy="69" r="4.5" /><circle cx="46" cy="84" r="4.5" /><circle cx="58" cy="47" r="4.5" /><circle cx="59" cy="62" r="4.5" /><circle cx="60" cy="77" r="4.5" /><circle cx="61" cy="92" r="4.5" /><circle cx="72" cy="56" r="4.5" /><circle cx="73" cy="79" r="4.5" /></g>
  <g data-region="low_concentration" fill="#F4A261" stroke="none"><circle cx="87" cy="47" r="4.5" /><circle cx="92" cy="78" r="4.5" /><circle cx="110" cy="60" r="4.5" /></g>
  <g data-region="gradient_direction" fill="none" stroke="#7B78C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 111L111 111M104.25 116L111 111L104.25 106" /></g>
  <g data-region="outline" fill="none" stroke="#26323D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 31c20 0 34 14 34 33S24 97 4 97z" /><circle cx="44" cy="40" r="4.5" /><circle cx="44" cy="54" r="4.5" /><circle cx="45" cy="69" r="4.5" /><circle cx="46" cy="84" r="4.5" /><circle cx="58" cy="47" r="4.5" /><circle cx="59" cy="62" r="4.5" /><circle cx="60" cy="77" r="4.5" /><circle cx="61" cy="92" r="4.5" /><circle cx="72" cy="56" r="4.5" /><circle cx="73" cy="79" r="4.5" /><circle cx="87" cy="47" r="4.5" /><circle cx="92" cy="78" r="4.5" /><circle cx="110" cy="60" r="4.5" /></g>
</svg>