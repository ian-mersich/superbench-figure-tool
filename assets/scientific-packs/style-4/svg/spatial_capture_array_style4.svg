<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Tissue-associated Spatial RNA Capture Array</title>
<desc id="desc">Original plan-view tissue context over regularly spaced spatially barcoded capture positions. Capture positions are not cells or measured expression; a position may collect RNA from multiple cells. Tissue shape, array pitch and count are illustrative.</desc>
<g data-region="substrate" fill="#E8EEF7" stroke="none"><rect x="17" y="17" width="94" height="94" rx="8" /></g>
<g data-region="tissue_context" fill="#C7F2EC" stroke="none"><path d="M31 40c2-11 17-17 30-11 14-7 29-2 35 10 7 12 3 22-4 31 4 15-9 28-24 25-12 7-27 1-31-10-12-3-17-17-12-28-3-6-1-12 6-17z" /></g>
<g data-region="capture_sites" fill="#7B78C9" stroke="none"><circle cx="32" cy="32" r="3.7" /><circle cx="53" cy="32" r="3.7" /><circle cx="74" cy="32" r="3.7" /><circle cx="95" cy="32" r="3.7" /><circle cx="32" cy="53" r="3.7" /><circle cx="53" cy="53" r="3.7" /><circle cx="74" cy="53" r="3.7" /><circle cx="95" cy="53" r="3.7" /><circle cx="32" cy="74" r="3.7" /><circle cx="53" cy="74" r="3.7" /><circle cx="74" cy="74" r="3.7" /><circle cx="95" cy="74" r="3.7" /><circle cx="32" cy="95" r="3.7" /><circle cx="53" cy="95" r="3.7" /><circle cx="74" cy="95" r="3.7" /><circle cx="95" cy="95" r="3.7" /></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="17" width="94" height="94" rx="8" /><path d="M31 40c2-11 17-17 30-11 14-7 29-2 35 10 7 12 3 22-4 31 4 15-9 28-24 25-12 7-27 1-31-10-12-3-17-17-12-28-3-6-1-12 6-17z" /></g>
</svg>