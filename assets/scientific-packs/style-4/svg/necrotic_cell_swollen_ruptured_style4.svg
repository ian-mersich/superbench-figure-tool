<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Necrotic Cell — Swollen and ruptured</title>
<desc id="desc">A swollen cell with a breached plasma membrane, vacuolization cues and released material. A generic lytic morphology, not a diagnosis or a distinct upstream death pathway. Necrosis-like appearance alone cannot distinguish accidental injury, necroptosis, pyroptosis, ferroptosis or late apoptotic secondary necrosis.</desc>
<g data-region="cytoplasm" id="cell-body-fill" fill="#C7F2EC"><path d="M103 76C106 90 94 103 78 107C55 114 29 100 22 80C12 57 28 28 51 23C71 17 91 23 101 42Z" /></g>
