<g data-region="outline" id="replicated-chromosome-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M36 24Q29 19 25 28Q22 33 27 42L43 52L28 92Q23 101 30 106Q38 109 43 101L52 64L83 102Q89 110 97 104Q103 99 97 90L62 52L98 40Q104 29 96 24Q87 20 82 30L52 40L45 27Q41 21 36 24Z" /></g>
<g data-region="centromere" id="centromere-region-fill" fill="#F4A261"><ellipse cx="52" cy="52" rx="11" ry="7" /></g>
<g data-region="outline" id="centromere-region-outline" fill="none" stroke="#26323D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="52" cy="52" rx="11" ry="7" /></g>
