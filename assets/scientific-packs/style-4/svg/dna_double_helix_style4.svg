<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title id="title">DNA double helix</title>
  <desc id="desc">Generic DNA helix schematic with smooth crossing backbones, connected evenly spaced base pairs, short terminal caps, and four editable color regions. Not a sequence or structural model.</desc>
