<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Gap Junction — En-face Plaque</title>
  <desc id="desc">An illustrative membrane-plane cluster of open-lumen gap-junction channels.</desc>
