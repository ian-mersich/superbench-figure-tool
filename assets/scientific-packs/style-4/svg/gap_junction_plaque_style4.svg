    <path d="M22 29Q58 13 102 27L111 91Q65 113 19 99Z" /><ellipse cx="45" cy="47" rx="11" ry="10" /><ellipse cx="77" cy="42" rx="11" ry="10" /><ellipse cx="62" cy="74" rx="11" ry="10" /><ellipse cx="91" cy="78" rx="11" ry="10" /><ellipse cx="34" cy="83" rx="11" ry="10" /><ellipse cx="45" cy="47" rx="4" ry="3.5" /><ellipse cx="77" cy="42" rx="4" ry="3.5" /><ellipse cx="62" cy="74" rx="4" ry="3.5" /><ellipse cx="91" cy="78" rx="4" ry="3.5" /><ellipse cx="34" cy="83" rx="4" ry="3.5" />
  </g>
