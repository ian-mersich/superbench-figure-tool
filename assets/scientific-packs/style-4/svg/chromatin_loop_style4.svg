<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title id="title">Chromatin loop</title>
  <desc id="desc">Generic compact chromatin schematic with one continuous smooth fiber, evenly spaced nucleosome-like beads centered on the fiber, and short terminal caps. Not an exact nucleosome arrangement or loop-extrusion model.</desc>
