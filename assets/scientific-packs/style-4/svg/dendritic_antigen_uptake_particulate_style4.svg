<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Dendritic Cell Antigen Uptake — Particulate antigen</title>
<desc id="desc">A dendritic-cell outline with extracellular antigen and an intracellular uptake compartment. Soluble and particulate forms are schematic uptake arrangements, not measurements of efficiency. Uptake does not establish processing, peptide presentation or T-cell activation.</desc>
