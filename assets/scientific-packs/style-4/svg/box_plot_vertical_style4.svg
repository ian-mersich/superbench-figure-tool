<title id="title">Box Plot — Vertical groups</title>
<desc id="desc">Editable vertical or horizontal box-and-whisker examples with central median lines. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. Boxes stand for the middle quartiles and central lines for medians; whisker rules, sample sizes, outliers and numerical summaries are unspecified.</desc>
