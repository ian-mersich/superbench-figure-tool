neric drawing, not a measured organelle reconstruction.", "Illustrative schematic; geometry, abundance and scale are not experimental measurements."], "scientific_references": [{"citation": "Nixon-Abell et al., Science, 2016", "doi": "10.1126/science.aaf3928", "figure": "Figures 3 and 5", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6528812/", "design_decision": "Connected irregular tubular ER matrices coexist with sheets; rough network retains cytoplasmic-face ribosomes, smooth ER omits ribosome context. Do not claim all ER sheets are tubes or copy measured density.", "use": "Connected irregular tubular ER matrices coexist with sheets; rough network retains cytoplasmic-face ribosomes, smooth ER omits ribosome context. Do not claim all ER sheets are tubes or copy measured density. Biological features and limitations only; no source artwork was copied."}]}, "source_archive": "scientific-packs(1).zip", "source_svg": "scientific-packs/core-biology/svg/rough_endoplasmic_reticulum.svg", "output_style": "Style 4", "batch": "007", "source_record_is_unmodified": true}</metadata><g id="part-001" data-region="membrane"><path d="M25 29C47 20 80 24 106 30L106 43C82 37 55 43 32 40L32 53C55 47 83 51 106 56L106 69C83 64 54 69 32 65L32 79C54 74 80 79 102 83L101 97C78 91 51 97 28 91C20 89 17 84 17 78L17 40C17 35 20 31 25 29Z" fill="#BFE7DE" id="s4-shape-0005" /></g><g id="part-002" data-region="outline"><path d="M25 29C47 20 80 24 106 30L106 43C82 37 55 43 32 40L32 53C55 47 83 51 106 56L106 69C83 64 54 69 32 65L32 79C54 74 80 79 102 83L101 97C78 91 51 97 28 91C20 89 17 84 17 78L17 40C17 35 20 31 25 29Z" fill="none" stroke="#2B3642" stroke-width="0.99" stroke-linecap="round" stroke-linejoin="round" id="s4-shape-0007" /></g><g id="part-003" data-region="lumen"><path d="M26 33C45 26 79 28 102 33L102 39C80 34 52 41 27 37L27 58C52 52 81 54 102 59L102 65C81 61 53 66 27 61L27 84C52 78 77 81 98 86L98 93C77 88 50 94 28 87C23 85 22 82 22 78L22 40Q21 34 26 33Z" fill="#FBFCFE" id="s4-shape-