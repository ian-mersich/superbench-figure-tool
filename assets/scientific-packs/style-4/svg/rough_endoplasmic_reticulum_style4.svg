<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title id="title">Rough Endoplasmic Reticulum</title>
  <desc id="desc">Illustrative rough ER sheets joined by a continuous membrane corridor and lumen. Ribosomes lie on cytosolic surfaces; this is a generic drawing, not a measured organelle reconstruction.</desc>
