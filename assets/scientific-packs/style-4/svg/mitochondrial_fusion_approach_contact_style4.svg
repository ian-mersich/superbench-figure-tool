<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Mitochondrial Fusion — Approach and contact</title>
<desc id="desc">Two mitochondrial profiles approaching a symbolic tethered membrane contact. A membrane-joining schematic, not resolved outer- versus inner-membrane fusion or evidence of content mixing. Tether identity, mitofusin or OPA1 stoichiometry, membrane potential, rate and biological outcome are not specified. Arrows indicate approach.</desc>
