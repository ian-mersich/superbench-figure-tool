<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Ferroptotic Cell — Schematic — Cell with mitochondrial detail</title>
<desc id="desc">A cell with symbolic lipid-damage marks and emphasized compact mitochondria with sparse cristae cues. A mechanism-oriented schematic, not a diagnostic appearance. Colored marks mean illustrative lipid peroxidation, not a particular stain or iron count; ferroptosis requires appropriate biochemical, genetic or pharmacological evidence. Mitochondrial changes vary by model.</desc>
