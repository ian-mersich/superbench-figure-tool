<g data-region="enzymes" id="lysosomal-enzyme-cue-3-fill" fill="#7B78C9"><circle cx="94" cy="79" r="3" /></g>
<g data-region="enzymes" id="lysosomal-enzyme-cue-4-fill" fill="#7B78C9"><circle cx="40" cy="88" r="3" /></g>
<g data-region="enzymes" id="lysosomal-enzyme-cue-5-fill" fill="#7B78C9"><circle cx="81" cy="94" r="3" /></g>
