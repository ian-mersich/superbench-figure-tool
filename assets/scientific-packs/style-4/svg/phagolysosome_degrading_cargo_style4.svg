<g data-region="outline" id="phagolysosomal-limiting-membrane-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M28 39C43 20 80 18 97 36C114 53 108 85 89 100C70 114 38 105 25 86C14 69 16 52 28 39Z" /></g>
