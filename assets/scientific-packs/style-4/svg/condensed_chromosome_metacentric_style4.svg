<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Condensed Chromosome — Metacentric</title>
<desc id="desc">A replicated condensed chromosome with similar-length arms and a central centromere cue. An isolated replicated chromosome schematic, not a karyotype or chromosome-specific anatomy. The X-like silhouette is not a universal chromosome shape or a depiction of DNA helix scale.</desc>
