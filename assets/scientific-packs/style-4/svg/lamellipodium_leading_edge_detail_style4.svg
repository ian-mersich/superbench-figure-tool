<g data-region="actin" id="branched-actin-2" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M70 91L82 34M75.40 65.35l-12-6M78.16 52.24l8-4" /></g>
<g data-region="actin" id="branched-actin-3" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M91 88L104 44M96.85 68.20l-12-6M99.84 58.08l8-4" /></g>
</svg>