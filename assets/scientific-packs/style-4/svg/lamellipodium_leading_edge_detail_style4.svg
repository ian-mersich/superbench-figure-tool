<g data-region="outline" id="leading-edge-sheet-outline" fill="none" stroke="#26323D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 98V57Q64 10 111 38V98Z" /></g>
<g data-region="membrane" id="leading-membrane" fill="none" stroke="#7DD3C7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 57Q62 12 111 38" /></g>
<g data-region="actin" id="branched-actin-0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M30 86L45 45M36.75 67.55l-12-6M40.20 58.12l8-4" /></g>
