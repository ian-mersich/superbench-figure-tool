<g data-region="outline" fill="#26323D" stroke="none" stroke-linecap="round" stroke-linejoin="round"><text x="64" y="119" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="400">Lactate high at source</text></g>
