<g data-region="outline" fill="none" stroke="#26323D" stroke-width="1.3" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="27" /><circle cx="64" cy="62" r="13" /></g>
<g data-region="source" fill="#C7F2EC" stroke="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="10" /></g>
<g data-region="outline" fill="none" stroke="#26323D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="62" r="10" /></g>
