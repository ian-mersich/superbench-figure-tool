<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title id="title">RNA Strand</title>
  <desc id="desc">Generic single-stranded RNA hairpin with one continuous backbone, a paired stem, an unpaired connecting loop and free ends. Base marks and lengths are illustrative; no sequence, measured fold or end chemistry is specified.</desc>
