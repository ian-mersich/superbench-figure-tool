<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Tertiary Lymphoid Structure — With germinal-center cue</title>
<desc id="desc">Organized lymphoid tissue with a B-cell follicle and adjacent T-cell zone, with or without a schematic germinal center. TLS organization and maturity vary with tissue and disease. B/T zones and a germinal-center cue are illustrative; no diagnosis, measured cell fraction or favorable outcome is implied.</desc>
