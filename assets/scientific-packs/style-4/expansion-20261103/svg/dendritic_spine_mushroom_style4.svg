<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="neuro.dendritic_spine.mushroom" data-illustration-style="Style 4"><title id="title">Dendritic spine — Mushroom</title><desc id="desc">A relatively broad head on a short, wider neck rising from a dendritic shaft. Morphology classes are simplified schematic forms; real spine shapes vary continuously and are context dependent.</desc><g data-region="dendrite" fill="#B7DBD3"><path d="M18 72 Q60 68 110 72 L110 104 Q63 109 18 102Z" /></g><g data-region="dendrite"><path d="M23 75 Q57 72 105 75 L105 80 Q61 78 23 82Z" fill="#FFFFFF" opacity="0.29" /><path d="M23 96 Q61 103 105 97 L105 102 Q62 109 23 102Z" fill="#40566B" opacity="0.11" /></g><g data-region="spine" fill="#84B9D7"><path d="M58 70 Q57 57 55 48 Q43 43 42 33 Q41 21 55 18 Q71 14 82 23 Q91 31 84 42 Q79 49 68 49 L68 70Z" /></g><g data-region="spine"><path d="M48 42 Q44 34 48 27 Q54 19 68 19 Q80 20 85 29 Q87 35 80 41 Q72 46 63 43 L62 69 H57 L57 44Z" fill="#FFFFFF" opacity="0.36" /><path d="M70 47 Q80 43 84 35 Q87 43 80 48 L68 51Z" fill="#40566B" opacity="0.13" /></g><g data-region="postsynaptic_density" fill="#E2A168"><path d="M72 22 Q84 25 85 34 Q84 41 77 44 L74 39 Q81 34 76 29Z" /></g><g data-region="postsynaptic_density"><path d="M75 24 Q84 29 80 37" fill="none" stroke="#FFFFFF" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.58" /></g><g data-region="outline" fill="none" stroke="#2B3642" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"><path d="M18 72 Q60 68 110 72 L110 104 Q63 109 18 102Z" /><path d="M58 70 Q57 57 55 48 Q43 43 42 33 Q41 21 55 18 Q71 14 82 23 Q91 31 84 42 Q79 49 68 49 L68 70Z" /><path d="M72 22 Q84 25 85 34 Q84 41 77 44" /></g></svg>