<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset-id="cellstress.cell.necrotic_cell.disintegrating" data-style="Style 4" data-artwork-revision="corrected-2026-10-17">
<title id="title">Necrotic Cell — Disintegrating</title>
<desc id="desc">An irregular cell remnant with discontinuous borders and separated cellular debris. A generic lytic morphology, not a diagnosis or a distinct upstream death pathway. Necrosis-like appearance alone cannot distinguish accidental injury, necroptosis, pyroptosis, ferroptosis or late apoptotic secondary necrosis.</desc>
