<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset-id="cellstress.nucleic_acid.replication_stress.reversed_fork" data-style="Style 4" data-artwork-revision="corrected-2026-10-17">
<title id="title">Replication Stress — Reversed fork</title>
<desc id="desc">A replication-fork schematic with an additional paired nascent-strand arm at the junction. A DNA topology schematic, not sequence, replication speed, specific replisome proteins or a demonstrated cellular state. Fork reversal is one response to stress and is not inevitable; a stalled Y fork does not itself prove reversal or DNA breakage.</desc>
