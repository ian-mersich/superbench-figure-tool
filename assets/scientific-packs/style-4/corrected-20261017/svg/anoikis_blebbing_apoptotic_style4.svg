<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset-id="cellstress.cell.anoikis.blebbing_apoptotic" data-style="Style 4" data-artwork-revision="corrected-2026-10-17">
<title id="title">Anoikis — Schematic — Detached blebbing cell</title>
<desc id="desc">A detached blebbing cell above extracellular matrix with chromatin fragmentation and an apoptotic-body cue. Anoikis means apoptosis associated with loss of appropriate matrix attachment. Detachment alone does not imply death; anchorage dependence and susceptibility vary by cell type, transformation state and culture conditions. Fragment number and timing are illustrative.</desc>
