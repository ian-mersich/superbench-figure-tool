<title id="title">Phagolysosome — Bacterial cargo</title>
<desc id="desc">A membrane-bounded phagolysosome containing a rod-shaped cargo cue and lysosomal enzyme cues. A mature degradative compartment schematic, not a demonstration of acidification, successful killing, a bacterial species or a measured digestion stage. Enzyme dots are illustrative and have no molecular count.</desc>
