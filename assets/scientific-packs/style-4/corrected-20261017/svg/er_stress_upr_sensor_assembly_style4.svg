<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset-id="cellstress.organelle.er_stress_upr.sensor_assembly" data-style="Style 4" data-artwork-revision="corrected-2026-10-17">
<title id="title">ER Stress / Unfolded Protein Response — Stress-sensor assembly</title>
<desc id="desc">An ER lumen containing unfolded protein cues with a clustered stress-sensor and illustrative outward signal cue. An IRE1-informed generic ER stress schematic, not the complete PERK, IRE1 and ATF6 branches. Sensor count, activation, XBP1 splicing, apoptosis and adaptive outcome are not measured or implied by shape alone. The arrow indicates a generic downstream signal.</desc>
