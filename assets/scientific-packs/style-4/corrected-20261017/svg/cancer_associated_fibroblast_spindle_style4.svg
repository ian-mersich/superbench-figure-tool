<title id="title">Cancer-associated Fibroblast — Spindle cell</title>
<desc id="desc">A fibroblast in tumor-associated context, shown alone or with surrounding extracellular matrix. CAF populations are heterogeneous. Shape, fibers and matrix do not identify a CAF subtype or a universal marker; add model-specific labels and evidence.</desc>
