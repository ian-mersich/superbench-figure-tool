<title id="title">CAR-NK Cell — Receptor display</title>
<desc id="desc">An NK-cell schematic with engineered surface-receptor cues, optionally contacting a target. CAR geometry, antigen specificity, signaling domains and receptor number are illustrative. Contact does not imply killing, response rate or a particular clinical construct.</desc>
