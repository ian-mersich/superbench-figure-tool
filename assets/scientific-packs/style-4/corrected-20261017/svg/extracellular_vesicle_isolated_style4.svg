<title id="title">Extracellular Vesicle — Isolated vesicle</title>
<desc id="desc">A closed extracellular lipid vesicle with illustrative internal cargo and surface components. An isolated EV silhouette cannot establish endosomal biogenesis or justify calling an observed vesicle an exosome. Only the release form illustrates an endosomal-origin model. No size, marker specificity, cargo sequence, purity, subtype or uptake mechanism is asserted.</desc>
