<title id="title">Volcano Plot — Threshold overview</title>
<desc id="desc">Editable example points on log2 fold-change and −log10(q) axes, with schematic threshold guides. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. q denotes an adjusted statistical value in this example. Dashed cutoffs are placeholders, not a specified significance threshold; A/B labels are generic features.</desc>
