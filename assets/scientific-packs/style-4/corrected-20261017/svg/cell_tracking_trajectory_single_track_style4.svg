<title id="title">Cell Tracking Trajectory — Single cell</title>
<desc id="desc">Editable spatial tracks with ordered positions and endpoint labels or direction arrows for one or two example cells. Illustrative editable template with invented positions, not measured data or an analysis result. Replace marks and labels with verified study-specific content before presenting results. Endpoint labels or arrows indicate time order of positions, unlike pseudotime. No speed, elapsed duration, migration bias, physical scale or lineage is encoded.</desc>
