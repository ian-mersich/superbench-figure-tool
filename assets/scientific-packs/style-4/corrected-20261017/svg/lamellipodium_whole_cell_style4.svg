<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset-id="cellstress.cell.lamellipodium.whole_cell" data-style="Style 4" data-artwork-revision="corrected-2026-10-17">
<title id="title">Lamellipodium — Whole cell</title>
<desc id="desc">A migrating cell with a broad leading-edge sheet and branched actin cues. A thin sheet-like protrusion schematic. Branch geometry, filament number, force, motility direction and Arp2/3 position are not measured. This form contrasts with a filopodium but does not assert mutually exclusive protrusion types.</desc>
