<title id="title">ER Stress / Unfolded Protein Response — Lumenal protein load</title>
<desc id="desc">An ER lumen containing unfolded protein cues and a paired membrane-associated stress-sensor cue. An IRE1-informed generic ER stress schematic, not the complete PERK, IRE1 and ATF6 branches. Sensor count, activation, XBP1 splicing, apoptosis and adaptive outcome are not measured or implied by shape alone. The arrow indicates a generic downstream signal.</desc>
