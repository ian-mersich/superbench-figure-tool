<title id="title">Microfluidic Cell Partition</title>
<desc id="desc">Original plan-view schematic of aqueous cell suspension pinching into separated droplets at an oil-flow junction. An occupied and an empty droplet illustrate non-guaranteed single-cell occupancy. Device geometry, occupancy and sizes are not experimental measurements.</desc>
