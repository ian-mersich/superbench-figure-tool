<title id="title">Mitochondrial Fission — Daughter separation</title>
<desc id="desc">Two separated daughter mitochondrial profiles with division-machinery disassembly cues. A generic division event, not complete DRP1, actin or ER-contact anatomy. Ring geometry, cristae number, mtDNA partitioning, fragment size, rates and stress or death outcomes are not specified. Separation is shown as a state rather than a measured motion.</desc>
