<title id="title">Mitochondrial Fusion — Joined mitochondrion</title>
<desc id="desc">A continuous elongated mitochondrial profile with a localized joining-site cue. A membrane-joining schematic, not resolved outer- versus inner-membrane fusion or evidence of content mixing. Tether identity, mitofusin or OPA1 stoichiometry, membrane potential, rate and biological outcome are not specified. Arrows indicate approach.</desc>
