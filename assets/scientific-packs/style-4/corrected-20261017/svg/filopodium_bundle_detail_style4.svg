<title id="title">Filopodium — Bundle detail</title>
<desc id="desc">An enlarged finger-like membrane protrusion containing parallel actin filaments and crosslink cues. A generic filopodial morphology; filament number, crosslinker identity and orientation, force, receptor localization and motility are not specified. The slender protrusion is not a microtubule-based cilium.</desc>
