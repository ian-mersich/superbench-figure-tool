<title id="title">Lamellipodium — Leading-edge detail</title>
<desc id="desc">An enlarged broad membrane sheet supported by several branched actin cues. A thin sheet-like protrusion schematic. Branch geometry, filament number, force, motility direction and Arp2/3 position are not measured. This form contrasts with a filopodium but does not assert mutually exclusive protrusion types.</desc>
