<title id="title">Lactate / Metabolite Gradient — Local radial source</title>
<desc id="desc">A producing-cell source and qualitative decrease of metabolite availability away from that source. The illustrated source direction is explicit and differs from oxygen delivery. Lactate production, uptake, clearance and pH vary; no concentration, flux, acidity or universal metabolic symbiosis is asserted.</desc>
