<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.corpus_luteum.folded_luteal_tissue"><title id="title">Corpus luteum — Folded luteal tissue</title><desc id="desc">Luteal cell cords and intervening capillary branches form a folded tissue field within a connective boundary. Generic luteal tissue. Does not distinguish granulosa- from theca-derived luteal cells, stage, species, or endocrine activity.</desc><g data-region="luteal"><path d="M20 29Q34 17 47 27Q56 33 49 43Q39 49 31 59Q23 69 18 60Q13 47 20 29Z" fill="#D9A27B" /><path d="M77 24Q91 19 103 31Q110 42 100 50Q91 53 82 45Q73 39 67 43Q66 31 77 24Z" fill="#D9A27B" /><path d="M18 76Q25 63 37 68Q47 72 49 84Q49 95 38 103Q25 104 19 94Q14 86 18 76Z" fill="#D9A27B" /><path d="M78 75Q87 64 100 70Q111 77 106 91Q102 103 89 104Q77 101 73 91Q70 83 78 75Z" fill="#D9A27B" /></g><g data-region="vessel"><path d="M16 24Q31 37 42 31T55 42Q45 53 34 59T18 73" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M68 20Q82 34 96 28T109 43Q98 55 85 47T61 50" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M17 68Q31 79 43 73T56 84Q47 98 31 104" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 70Q83 81 97 74T109 87Q101 101 86 105" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g><g data-region="antrum"><ellipse cx="64" cy="64" rx="9" ry="7" fill="#E8F4F8"/></g><g data-region="outline"><path d="M17 29Q31 14 48 25Q63 15 78 23Q100 16 109 37Q119 54 108 69Q117 88 99 102Q81 113 65 103Q46 114 29 101Q11 89 20 71Q9 51 17 29Z" fill="none" stroke="#3C505B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>