<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.corpus_luteum.radial_luteal_tissue"><title id="title">Corpus luteum — Radial luteal tissue</title><desc id="desc">Luteal cell cords radiate around an optional central cavity and are interspersed with capillary branches. Generic luteal tissue. Does not distinguish granulosa- from theca-derived luteal cells, stage, species, or endocrine activity.</desc><g data-region="luteal"><path d="M56 18Q67 14 74 25L70 49Q65 55 60 49Z" fill="#D9A27B" /><path d="M86 24Q97 26 98 37L79 56Q72 57 71 50Z" fill="#D9A27B" /><path d="M106 51Q110 61 102 68L78 67Q72 62 77 56Z" fill="#D9A27B" /><path d="M105 78Q101 89 90 87L73 70Q73 64 81 63Z" fill="#D9A27B" /><path d="M82 106Q71 111 66 101L71 76Q77 71 82 78Z" fill="#D9A27B" /><path d="M54 108Q43 104 49 92L60 71Q67 70 70 78Z" fill="#D9A27B" /><path d="M25 86Q20 76 29 68L54 75Q60 81 53 86Z" fill="#D9A27B" /><path d="M22 50Q27 39 39 46L58 58Q59 65 51 68Z" fill="#D9A27B" /></g><g data-region="vessel"><path d="M64 15Q65 31 66 48" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 26Q81 40 72 53" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M109 59Q92 61 76 62" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M109 83Q91 76 77 67" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M77 108Q73 88 68 74" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 109Q57 89 62 71" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M19 79Q39 72 56 67" fill="none" stroke="#C44D4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M19 46Q41 52 59 61" fill="none" stroke="#C44D4