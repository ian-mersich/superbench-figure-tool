<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" data-asset="endocrine.median_eminence.external_zone_sagittal"><title id="title">Median eminence — Sagittal neurovascular section</title><desc id="desc">Hypothalamic terminal profiles approach a portal capillary across a tanycyte-associated boundary from deeper neural tissue. Shows a simplified external-zone interface. It is distinct from the posterior pituitary and does not assign a releasing hormone or downstream effect.</desc><g data-region="neural"><path d="M13 16H115V43Q78 37 59 49T13 47Z" fill="#B5A9D5" /></g><g data-region="terminal"><path d="M20 65Q32 51 42 65L44 81Q31 72 20 82Z" fill="#E5B76C" /><path d="M51 63Q64 52 74 66L75 82Q61 72 51 81Z" fill="#E5B76C" /><path d="M82 62Q96 51 105 66L107 82Q93 72 82 80Z" fill="#E5B76C" /></g><g data-region="boundary"><path d="M23 43Q30 49 25 61" fill="none" stroke="#D3C1A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 43Q64 49 59 61" fill="none" stroke="#D3C1A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 43Q98 49 93 61" fill="none" stroke="#D3C1A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g data-region="sinusoid"><path d="M15 91Q39 77 63 88T114 80V108Q80 113 60 102T15 111Z" fill="#D8EDF5" /></g><g data-region="outline"><path d="M13 16H115V43Q78 37 59 49T13 47Z" fill="none" stroke="#3C505B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 42Q28 48 25 59" fill="none" stroke="#3C505B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M57 42Q62 48 59 59" fill="none" stroke="#3C505B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M91 42Q96 48 93 59" fill="none" stroke="#3C505B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M15 91Q39 77 63 88T114 80V108Q80 113 60 102T15 111Z" fill="none" stroke="#3C505B" stroke