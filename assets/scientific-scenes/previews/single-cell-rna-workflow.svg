<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">Droplet single-cell RNA workflow</title><desc id="desc">Cell suspension, droplet partitioning and barcoded RNA capture followed by library preparation and sequencing.</desc>
