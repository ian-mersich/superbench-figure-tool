<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="partition_title partition_desc" x="260" y="150" width="128" height="128">
  <title id="partition_title">Microfluidic Cell Partition</title>
  <desc id="partition_desc">Original editable plan-view schematic of an aqueous cell suspension meeting an oil stream at a microfluidic junction and forming separated droplets. One occupied and one empty droplet illustrate partitioning without implying guaranteed single-cell occupancy, device dimensions, or a quantitative yield.</desc>
