<text x="40" y="53" text-anchor="start" font-family="Arial,sans-serif" font-size="28" fill="#26323D"><tspan x="40" dy="0">Droplet single-cell RNA sequencing</tspan></text>
<text x="40" y="85" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#667085"><tspan x="40" dy="0">An editable method schematic · replace labels for your protocol</tspan></text>
<text x="120.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26323D"><tspan x="120.0" dy="0">Cell suspension</tspan></text>
<text x="324.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26323D"><tspan x="324.0" dy="0">Droplet partition</tspan></text>
<text x="549.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26323D"><tspan x="549.0" dy="0">cDNA library</tspan></text>
<text x="774.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26323D"><tspan x="774.0" dy="0">Sequencing</tspan></text>
<text x="1000.0" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26323D"><tspan x="1000.0" dy="0">Barcode + RNA reads</tspan></text>
<text x="40" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#2A9D8F"><tspan x="40" dy="0">Oligo-barcoded</tspan><tspan x="40" dy="22.5">RNA capture bead</tspan></text>
<text x="442" y="399" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#26323D"><tspan x="442" dy="0">Cell barcode and UMI have different roles</tspan></text>
<text x="442" y="434" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#667085"><tspan x="442" dy="0">Shared bead barcode → assign captured RNA to a partition</tspan><tspan x="442" dy="20.0">Different UMIs → distinguish captured molecules</tspan></text>
<text x="40" y="564" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#667085"><tspan x="40" dy="0">Schematic only. Empty partitions and multiplets occur; RNA recovery and cell quality require review.</tspan></text>
</svg>
