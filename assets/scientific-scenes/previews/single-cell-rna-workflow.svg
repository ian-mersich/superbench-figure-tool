<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="bead_title bead_desc" x="260" y="374" width="120" height="120">
  <title id="bead_title">Oligo-barcoded RNA Capture Bead</title>
  <desc id="bead_desc">Original editable schematic of a bead bearing tethered capture oligonucleotides. Purple segments denote the shared bead barcode, orange segments denote molecular identifier regions whose sequences vary among oligonucleotides, and teal terminal segments denote poly(dT) capture tails. The segments and number of oligonucleotides are illustrative, not actual sequences or stoichiometry.</desc>
  <g data-region="bead_body" fill="#8EC8FF" stroke="none">
    <circle cx="64" cy="64" r="27" />
  </g>
  <g data-region="cell_barcode" fill="none" stroke="#7B78C9" stroke-width="4" stroke-linecap="round">
    <path d="M64 35v-8" />
    <path d="M64 35v-8" transform="rotate(45 64 64)" />
    <path d="M64 35v-8" transform="rotate(90 64 64)" />
