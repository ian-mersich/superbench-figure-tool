    <path d="M64 35v-8" transform="rotate(315 64 64)" />
  </g>
  <g data-region="molecular_identifier" fill="none" stroke="#F4A261" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 27l-1-3 1-3" />
    <path d="M64 27l1-3-1-3" transform="rotate(45 64 64)" />
    <path d="M64 27l-1-2 2-2-1-2" transform="rotate(90 64 64)" />
    <path d="M64 27l1-2-2-2 1-2" transform="rotate(135 64 64)" />
    <path d="M64 27l-1-3 1-3" transform="rotate(180 64 64)" />
    <path d="M64 27l1-3-1-3" transform="rotate(225 64 64)" />
    <path d="M64 27l-1-2 2-2-1-2" transform="rotate(270 64 64)" />
    <path d="M64 27l1-2-2-2 1-2" transform="rotate(315 64 64)" />
  </g>
  <g data-region="polydt_capture_tail" fill="none" stroke="#7DD3C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 21v-7m-3 2h6m-6 3h6" />
    <path d="M64 21v-7m-3 2h6m-6 3h6" transform="rotate(45 64 64)" />
    <path d="M64 21v-7m-3 2h6m-6 3h6" transform="rotate(90 64 64)" />
