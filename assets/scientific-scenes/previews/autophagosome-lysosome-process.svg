<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Autophagosome–lysosome process scene preview</title>
  <desc id="desc">Original editable-style preview of a qualitative macroautophagy sequence from an LC3-associated phagophore and selected SQSTM1/p62-linked cargo through autophagosome closure, lysosomal fusion, autolysosome formation, and cargo degradation.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A9D8F"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6AA9E9"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#F4A261"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F6F8FB"/>
  <text x="40" y="43" fill="#26323D" font-family="Arial, sans-serif" font-size="25" font-weight="700">Autophagosome–lysosome process</text>
  <text x="40" y="69" fill="#667085" font-family="Arial, sans-serif" font-size="14">Selected macroautophagy stages from phagophore formation to lysosomal cargo degradation</text>
  <rect x="30" y="90" width="900" height="365" rx="22" fill="#FFFFFF" stroke="#D9E4EC" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-weight="700" fill="#26323D" font-size="16">
    <text x="45" y="124">1  Phagophore formation</text>
    <text x="455" y="124">3  Lysosomal fusion</text>
    <text x="760" y="124">4  Autolysosome</text>
  </g>
  <text x="260" y="118" fill="#26323D" font-family="Arial, sans-serif" font-size="16" font-weight="700"><tspan x="260">2  Sealed</tspan><tspan x="260" dy="20">autophagosome</tspan></text>
  <text x="45" y="150" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="14" font-weight="600">Cargo sequestration</text>

  <g aria-label="Open phagophore with selected cargo">
    <path d="M191 173C119 147 63 185 61 236c-2 48 54 80 132 63" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
    <path d="M183 190c-54-18-101 10-103 47-2 34 41 58 102 47" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="132" cy="222" rx="24" ry="18" fill="#D9D7FF" stroke="#7B78C9" stroke-width="2"/>
    <ellipse cx="169" cy="250" rx="17" ry="12" fill="#D9D7FF" stroke="#7B78C9" stroke-width="2"/>
    <circle cx="72" cy="194" r="6" fill="#4F7CAC"/>
    <circle cx="62" cy="225" r="6" fill="#4F7CAC"/>
    <circle cx="69" cy="257" r="6" fill="#4F7CAC"/>
    <rect x="100" y="278" width="110" height="30" rx="8" fill="#F4A261" stroke="#26323D" stroke-width="1.8"/>
    <text x="155" y="298" text-anchor="middle" fill="#26323D" font-family="Arial, sans-serif" font-size="13" font-weight="600">SQSTM1/p62</text>
    <text x="51" y="291" fill="#4F7CAC" font-family="Arial, sans-serif" font-size="13" font-weight="600">LC3</text>
    <text x="166" y="329" text-anchor="middle" fill="#7B78C9" font-family="Arial, sans-serif" font-size="12">selected cargo</text>
  </g>

  <path d="M214 238h48" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="238" y="221" text-anchor="middle" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="12">closure</text>

  <g aria-label="Sealed double-membrane autophagosome">
    <path d="M294 238c-1-44 31-69 68-66 41 4 65 36 58 76-7 41-47 65-85 51-27-10-40-32-41-61z" fill="#D9F4E5" stroke="#26323D" stroke-width="3"/>
    <path d="M307 239c0-34 25-53 54-51 32 3 50 27 45 58-5 30-36 49-65 38-21-8-33-25-34-45z" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
    <ellipse cx="350" cy="226" rx="15" ry="11" fill="#D9D7FF" stroke="#7B78C9" stroke-width="2"/>
    <ellipse cx="376" cy="255" rx="12" ry="9" fill="#D9D7FF" stroke="#7B78C9" stroke-width="2"/>
    <circle cx="308" cy="203" r="6" fill="#4F7CAC"/>
    <circle cx="405" cy="235" r="6" fill="#4F7CAC"/>
  </g>

  <path d="M425 238h39" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="445" y="221" text-anchor="middle" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="12">completed</text>

  <g aria-label="Completed autophagosome approaching lysosome">
    <path d="M480 239c0-34 25-55 54-53 33 2 52 28 47 59-5 32-37 51-67 40-22-8-34-26-34-46z" fill="#D9F4E5" stroke="#26323D" stroke-width="3"/>
    <path d="M490 239c0-27 20-43 43-41 26 2 41 22 37 46-4 25-29 40-53 32-17-7-27-21-27-37z" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
    <ellipse cx="532" cy="238" rx="15" ry="11" fill="#D9D7FF" stroke="#7B78C9" stroke-width="2"/>
    <path d="M622 238c-2-36 26-57 56-52 31 5 48 33 38 63-10 30-44 44-71 29-15-9-22-23-23-40z" fill="#E4DFFF" stroke="#6AA9E9" stroke-width="4"/>
    <circle cx="661" cy="219" r="7" fill="#E76F51"/>
    <circle cx="684" cy="243" r="6" fill="#F4A261"/>
    <circle cx="652" cy="258" r="5" fill="#E76F51"/>
    <path d="M585 238h33" fill="none" stroke="#6AA9E9" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="601" y="216" text-anchor="middle" fill="#6AA9E9" font-family="Arial, sans-serif" font-size="12">fusion</text>
  </g>

  <path d="M726 238h50" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="751" y="221" text-anchor="middle" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="12">forms</text>
  <text x="850" y="151" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="12">Lysosomal enzymes act on cargo</text>

  <g aria-label="Autolysosome and selected degradation products">
    <path d="M791 238c-2-42 30-68 66-62 38 6 59 40 47 76-12 35-54 52-86 34-18-11-27-29-27-48z" fill="#D9F4E5" stroke="#2A9D8F" stroke-width="4"/>
    <circle cx="835" cy="215" r="8" fill="#E76F51"/>
    <circle cx="867" cy="233" r="7" fill="#F4A261"/>
    <circle cx="829" cy="259" r="6" fill="#E76F51"/>
    <ellipse cx="821" cy="396" rx="11" ry="8" fill="#E9B44C" stroke="#26323D" stroke-width="1.3"/>
    <circle cx="855" cy="393" r="8" fill="#E9B44C" stroke="#26323D" stroke-width="1.3"/>
    <ellipse cx="888" cy="399" rx="11" ry="7" fill="#E9B44C" stroke="#26323D" stroke-width="1.3"/>
    <path d="M850 307v73" fill="none" stroke="#E76F51" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <text x="784" y="351" fill="#E76F51" font-family="Arial, sans-serif" font-size="12">cargo degradation</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#667085">
    <text x="137" y="350"><tspan x="137">Open membrane surrounds</tspan><tspan x="137" dy="17">a selected cargo example</tspan></text>
    <text x="352" y="350"><tspan x="352">Double membrane encloses</tspan><tspan x="352" dy="17">sequestered material</tspan></text>
    <text x="600" y="321"><tspan x="600">completed autophagosome + lysosome</tspan></text>
    <text x="850" y="430">selected breakdown products</text>
  </g>

  <path d="M156 276 138 243" fill="none" stroke="#F4A261" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <path d="M100 291 73 261" fill="none" stroke="#4F7CAC" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <text x="480" y="503" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="12">Static schematic only — LC3 or SQSTM1/p62 placement does not measure autophagic flux.</text>
</svg>
