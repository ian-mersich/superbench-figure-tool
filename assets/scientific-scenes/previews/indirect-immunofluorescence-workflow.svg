<text x="36" y="51" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#24313B"><tspan x="36" dy="0">Indirect immunofluorescence workflow</tspan></text>
<text x="106.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="106.0" dy="0">1</tspan></text>
<text x="111.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="111.0" dy="0">Cell model</tspan></text>
<text x="111.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="111.0" dy="0">Culture or tissue</tspan></text>
<text x="288.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="288.0" dy="0">2</tspan></text>
<text x="293.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="293.0" dy="0">Prepare specimen</tspan></text>
<text x="293.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="293.0" dy="0">Fix, permeabilize +</tspan><tspan x="293.0" dy="18.4">block</tspan></text>
<text x="470.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="470.0" dy="0">3</tspan></text>
<text x="475.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="475.0" dy="0">Primary antibody</tspan></text>
<text x="475.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="475.0" dy="0">Recognize target</tspan></text>
<text x="652.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="652.0" dy="0">4</tspan></text>
<text x="657.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="657.0" dy="0">Fluorescent</tspan><tspan x="657.0" dy="19.549999999999997">secondary</tspan></text>
<text x="657.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="657.0" dy="0">Label primary</tspan><tspan x="657.0" dy="18.4">antibody</tspan></text>
<text x="834.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="834.0" dy="0">5</tspan></text>
<text x="839.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="839.0" dy="0">Wash + mount</tspan></text>
<text x="839.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="839.0" dy="0">Reduce unbound signal</tspan></text>
<text x="1016.0" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="1016.0" dy="0">6</tspan></text>
<text x="1021.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#527DA8"><tspan x="1021.0" dy="0">Image</tspan></text>
<text x="1021.0" y="297" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="1021.0" dy="0">Acquire channels</tspan></text>
<text x="36" y="394" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#637381"><tspan x="36" dy="0">Schematic · adapt labels and controls to your experiment</tspan></text>
</svg>
