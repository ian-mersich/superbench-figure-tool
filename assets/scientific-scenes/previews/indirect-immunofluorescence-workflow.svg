</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="stage_3_object_title stage_3_object_desc" x="412" y="127" width="74" height="74">
  <ns0:title id="stage_3_object_title">IgG Antibody</ns0:title>
  <ns0:desc id="stage_3_object_desc">Original IgG schematic with two continuous heavy chains, one shorter light chain per arm, a hinge and two antigen-binding tips. Symbolic configuration; no fixed conformation, subclass, affinity or activity is implied.</ns0:desc>
