<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Indirect immunofluorescence workflow</title><desc id="desc">Fixed-cell labeling with a target-specific primary antibody and fluorophore-linked secondary antibody.</desc>
<rect width="1120" height="430" fill="#F7F9FC"/>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="stage_1_object_title stage_1_object_desc" x="48" y="127" width="74" height="74">
