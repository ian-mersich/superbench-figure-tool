  <ns0:title id="stage_2_object_title">RNA Strand — Linear Form</ns0:title>
  <ns0:desc id="stage_2_object_desc">Generic open single-stranded RNA with one continuous unpaired backbone and connected base marks. This extended form specifies no sequence, folding state or terminal chemistry.</ns0:desc>
