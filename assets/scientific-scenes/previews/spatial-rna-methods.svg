<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="array_title array_desc" x="274" y="172" width="128" height="128">
  <title id="array_title">Tissue-associated Spatial RNA Capture Array</title>
  <desc id="array_desc">Original editable plan-view schematic of a tissue section associated with an array of spatially barcoded RNA capture positions. The purple sites indicate capture positions, not individual cells or measured expression. A capture site can contain RNA from multiple cells; spacing, tissue shape, and resolution are illustrative.</desc>
