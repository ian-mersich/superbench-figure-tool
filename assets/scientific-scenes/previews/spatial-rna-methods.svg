  <desc id="puncta_desc">Original editable schematic of an RNA fluorescence in situ hybridization field, with cell context, nuclei, and illustrative RNA-associated puncta. This is not a microscopy image or measured dataset. Dot numbers, positions, colors, and sizes do not encode expression levels, molecule counts, a named target, or a physical scale.</desc>
