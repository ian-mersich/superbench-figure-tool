<text x="40" y="662" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#667085"><tspan x="40" dy="0">Capture spots may sample multiple cells. Resolution depends on the method; both routes require assay-specific controls.</tspan></text>
