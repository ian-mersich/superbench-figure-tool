<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">T-cell activation and PD-1 checkpoint scene preview</title>
  <desc id="desc">Original editable-style preview of peptide-MHC and TCR recognition, CD28 and B7 co-stimulation, compact LCK, ZAP-70 and LAT signaling, and a PD-1 to SHP2 inhibitory branch.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4F7CAC"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A9D8F"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F6F8FB"/>
  <text x="40" y="43" fill="#26323D" font-family="Arial, sans-serif" font-size="25" font-weight="700">T-cell activation and PD-1 checkpoint</text>
  <text x="40" y="69" fill="#667085" font-family="Arial, sans-serif" font-size="14">Antigen recognition + co-stimulation, with one context-bounded inhibitory branch</text>
  <rect x="38" y="82" width="884" height="178" rx="18" fill="#FFFFFF" stroke="#D9E4EC" stroke-width="2"/>
  <rect x="38" y="278" width="884" height="188" rx="18" fill="#FFFFFF" stroke="#D9E4EC" stroke-width="2"/>
  <text x="56" y="104" fill="#667085" font-family="Arial, sans-serif" font-size="12">APC-facing ligands</text>
  <text x="56" y="300" fill="#667085" font-family="Arial, sans-serif" font-size="12">T-cell signaling</text>
