    <path d="M378 124v26l10 12-10 12" fill="none" stroke="#4F7CAC" stroke-width="9" stroke-linecap="round"/>
    <path d="M344 198v-23l-10-13 10-12M378 198v-23l10-13-10-12" fill="none" stroke="#2A9D8F" stroke-width="9" stroke-linecap="round"/>
    <circle cx="361" cy="162" r="7" fill="#F4A261"/>
    <text x="372" y="247" text-anchor="middle" fill="#2A9D8F" font-family="Arial, sans-serif" font-size="13" font-weight="600">B7 (CD80/CD86) · CD28</text>
  </g>
