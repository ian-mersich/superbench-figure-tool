  <path d="M163 338h52M285 338h48" fill="none" stroke="#4F7CAC" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M372 207 512 302" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
