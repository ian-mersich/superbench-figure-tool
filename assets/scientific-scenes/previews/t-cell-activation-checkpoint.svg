  <text x="583" y="255" fill="#C84C3A" font-family="Arial, sans-serif" font-size="11" font-weight="600">preferentially attenuates</text>
  <rect x="398" y="405" width="250" height="47" rx="14" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
  <path d="M369 367 447 405M519 367v38" fill="none" stroke="#2A9D8F" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="523" y="434" text-anchor="middle" fill="#26323D" font-family="Arial, sans-serif" font-size="14" font-weight="600">Editable activation program</text>
  <text x="480" y="510" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="11">Simplified authoring starter — not a complete, quantitative, stoichiometric, temporal, causal, or state-equivalent pathway model.</text>
</svg>
