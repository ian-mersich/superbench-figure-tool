<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="thyroid_follicle_title thyroid_follicle_desc" data-asset="endocrine.thyroid_follicle.single_follicle" x="758" y="190" width="204" height="142" data-scene-node="thyroid_follicle"><ns0:title id="thyroid_follicle_title">Thyroid follicle — Single follicle</ns0:title><ns0:desc id="thyroid_follicle_desc">A section through one colloid-filled follicle bounded by follicular epithelium. State-neutral schematic; epithelial height, colloid texture, and follicle size are not quantitative.</ns0:desc><ns0:g data-region="stroma"><ns0:path d="M24 102 Q39 94 49 101 M79 101 Q92 94 104 102 M22 28 Q29 22 35 23" fill="none" stroke="#E7EEF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:g data-region="follicular_epithelium"><ns0:ellipse cx="64" cy="64" rx="46" ry="46" fill="#527DA8" stroke="none" /><ns0:ellipse cx="64" cy="19" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="97" cy="34" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="109" cy="64" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="94" cy="96" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="64" cy="109" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="32" cy="94" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="19" cy="64" rx="4" ry="6" fill="#527DA8" stroke="none" /><ns0:ellipse cx="35" cy="32" rx="4" ry="6" fill="#527DA8" stroke="none" /></ns0:g><ns0:g data-region="colloid"><ns0:ellipse cx="64" cy="64" rx="34" ry="34" fill="#D79A31" stroke="none" /></ns0:g><ns0:g data-region="outline"><ns0:path d="M18 64 C18 38 38 18 64 18 C90 18 110 38 110 64 C110 90 90 110 64 110 C38 110 18 90 18 64Z" fill="none" stroke="#24313B" stroke-width="1.3" stroke-linejoin="round" /><ns0:circle cx="64" cy="64" r="34" fill="none" stroke="#24313B" stroke-width="1.1" /></ns0:g></ns0:svg>
