<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="anterior_pituitary_title anterior_pituitary_desc" data-asset="endocrine.anterior_pituitary.cords_longitudinal" x="413" y="207" width="132" height="104" data-scene-node="anterior_pituitary"><ns0:title id="anterior_pituitary_title">Anterior pituitary — Interlacing cords</ns0:title><ns0:desc id="anterior_pituitary_desc">Glandular cell cords run between branching sinusoidal channels in a longitudinal tissue field. Generic anterior-lobe parenchyma. Cells are not assigned to hormone-producing classes; vascular geometry is illustrative.</ns0:desc><ns0:g data-region="gland"><ns0:ellipse cx="36" cy="27" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="43" cy="43" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="37" cy="59" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="40" cy="81" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="39" cy="99" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="76" cy="25" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="77" cy="43" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="73" cy="59" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="77" cy="79" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="76" cy="99" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="111" cy="32" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="111" cy="58" rx="6" ry="8" fill="#527DA8" /><ns0:ellipse cx="112" cy="83" rx="6" ry="8" fill="#527DA8" /></ns0:g><ns0:g data-region="sinusoid"><ns0:path d="M22 23Q34 35 24 47T24 72T22 104" fill="none" stroke="#2A8C82" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M58 20Q47 31 59 44T57 68T60 91T55 108" fill="none" stroke="#2A8C82" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M97 19Q86 31 98 45T95 70T101 94T96 109" fill="none" stroke="#2A8C82" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:g data-region="outline"><ns0:path d="M22 23Q34 35 24 47T