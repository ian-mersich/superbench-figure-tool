  <text x="709" y="360" text-anchor="middle" fill="#26323D" font-family="Arial, sans-serif" font-size="12" font-weight="600">Proximal handoff</text>
  <text x="788" y="315" text-anchor="middle" fill="#C84C3A" font-family="Arial, sans-serif" font-size="11">attenuates CD28</text>
  <text x="805" y="426" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="11">checkpoint context</text>
  <text x="480" y="503" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="11">Qualitative orientation only — not a complete receptor catalog, quantitative or kinetic pathway, causal analysis, or clinical claim.</text>
