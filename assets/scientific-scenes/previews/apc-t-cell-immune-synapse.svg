  <text x="264" y="412" text-anchor="middle" fill="#4F7CAC" font-family="Arial, sans-serif" font-size="13" font-weight="600">T cell</text>
  <text x="370" y="122" fill="#26323D" font-family="Arial, sans-serif" font-size="15" font-weight="700">Selected synapse contacts</text>
