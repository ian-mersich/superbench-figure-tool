<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">APC–T-cell immune synapse scene preview</title>
  <desc id="desc">Original editable-style preview of an antigen-presenting-cell and T-cell interface, selected peptide-MHC and TCR recognition, CD28 and B7 costimulation, PD-1 and PD-L1 checkpoint context, and a small proximal signaling handoff.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4F7CAC"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2A9D8F"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7B78C9"/></marker>
  </defs>
  <rect width="960" height="540" fill="#F6F8FB"/>
