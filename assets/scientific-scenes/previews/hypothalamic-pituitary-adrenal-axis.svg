<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="median_eminence_title median_eminence_desc" data-asset="endocrine.median_eminence.external_zone_sagittal" x="108" y="196" width="142" height="116" data-scene-node="median_eminence"><ns0:title id="median_eminence_title">Median eminence — Sagittal neurovascular section</ns0:title><ns0:desc id="median_eminence_desc">Hypothalamic terminal profiles approach a portal capillary across a tanycyte-associated boundary from deeper neural tissue. Shows a simplified external-zone interface. It is distinct from the posterior pituitary and does not assign a releasing hormone or downstream effect.</ns0:desc><ns0:g data-region="neural"><ns0:path d="M15 18H112V43Q81 40 61 48T15 45Z" fill="#527DA8" /></ns0:g><ns0:g data-region="terminal"><ns0:path d="M24 63Q32 55 39 65L42 79Q32 74 24 78Z" fill="#D79A31" /><ns0:path d="M53 62Q62 55 69 65L72 79Q61 74 53 78Z" fill="#D79A31" /><ns0:path d="M84 62Q93 54 100 65L103 78Q93 74 84 78Z" fill="#D79A31" /></ns0:g><ns0:g data-region="boundary"><ns0:path d="M28 42Q33 48 30 59" fill="none" stroke="#C9D5DE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M60 42Q65 48 62 59" fill="none" stroke="#C9D5DE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M92 42Q97 48 94 59" fill="none" stroke="#C9D5DE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></ns0:g><ns0:g data-region="sinusoid"><ns0:path d="M18 88Q41 80 62 87T111 82V104Q83 110 62 101T18 108Z" fill="#2A8C82" /></ns0:g><ns0:g data-region="outline"><ns0:path d="M15 18H112V43Q81 40 61 48T15 45Z" fill="none" stroke="#24313B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M28 42Q33 48 30 59" fill="none" stroke="#24313B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /><ns0:path d="M60 42Q65 48 62 59" fill="none" stroke="#24313B" stroke-width="1.1" stroke-linecap="round" 